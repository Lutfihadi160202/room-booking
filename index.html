<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomMaster X | Pro Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --accent: #ff0055; 
            --dark: #0f172a;
            --bg: #ffffff;
        }

        body { 
            font-family: 'Bricolage Grotesque', sans-serif; 
            background: var(--bg); 
            color: var(--dark);
        }

        /* Hero Section */
        .hero-section {
            background: var(--dark);
            color: white;
            padding: 60px 0 100px 0;
            border-bottom: 5px solid var(--accent);
        }

        /* Bento Card Style (Neo-Brutalism) */
        .bento-card {
            background: white;
            border: 3px solid var(--dark);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 10px 10px 0px var(--dark);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }
        .bento-card:hover { transform: translate(-3px, -3px); box-shadow: 13px 13px 0px var(--accent); }

        .overlap-content { margin-top: -60px; }

        /* Form Styling */
        .form-control, .form-select {
            border: 2px solid var(--dark);
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
        .form-control:focus { border-color: var(--accent); box-shadow: none; }

        /* Status Badges */
        .status-pill {
            padding: 6px 15px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 800;
            border: 2px solid var(--dark);
            display: inline-block;
            text-transform: uppercase;
        }
        .bg-pending { background: #ffef00; color: black; }
        .bg-approved { background: #00ff88; color: black; }
        .bg-rejected { background: #ff4d4d; color: white; }

        /* Buttons */
        .btn-main {
            background: var(--accent);
            color: white;
            border: 3px solid var(--dark);
            border-radius: 12px;
            padding: 12px 25px;
            font-weight: 800;
            box-shadow: 4px 4px 0px var(--dark);
        }
        .btn-main:hover { background: var(--dark); color: white; transform: translateY(-2px); }

        .btn-approve { background: #00ff88; border: 2px solid var(--dark); border-radius: 8px; }
        .btn-reject { background: #ff4d4d; border: 2px solid var(--dark); border-radius: 8px; color: white; }

        /* Filter Tabs */
        .filter-group {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .filter-btn {
            background: white;
            border: 2px solid var(--dark);
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        .filter-btn.active { background: var(--dark); color: white; }

        .stat-val { font-size: 2.5rem; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bolder fs-3" href="#">RM<span style="color: var(--accent);">.X</span></a>
            <button class="btn btn-outline-light fw-bold rounded-pill" data-bs-toggle="modal" data-bs-target="#modalRuangan">
                <i class="fas fa-plus-circle me-2"></i>Manage Rooms
            </button>
        </div>
    </nav>

    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-3 fw-800 mb-0">BOOKING HUB</h1>
            <p class="opacity-75 fw-bold">Pusat Kendali Reservasi Ruangan Kantor</p>
        </div>
    </div>

    <div class="container overlap-content">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="bento-card text-center">
                    <div class="small fw-bold opacity-50">WAITING</div>
                    <div class="stat-val" id="statPending">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="bento-card text-center">
                    <div class="small fw-bold opacity-50">APPROVED</div>
                    <div class="stat-val" id="statApproved">0</div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="bento-card">
                    <form id="bookingForm" class="row g-2">
                        <div class="col-6"><input type="text" id="nama" class="form-control" placeholder="Nama Anda" required></div>
                        <div class="col-6"><select id="ruangan" class="form-select" required></select></div>
                        <div class="col-4"><input type="date" id="tglMulai" class="form-control" required></div>
                        <div class="col-4"><input type="time" id="jamMulai" class="form-control" required></div>
                        <div class="col-4"><button type="submit" class="btn btn-main w-100">BOOK <i class="fas fa-bolt"></i></button></div>
                    </form>
                </div>
            </div>

            <div class="col-12">
                <div class="bento-card">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                        <h4 class="fw-800 m-0"><i class="fas fa-list me-2"></i>Reservation List</h4>
                        <div class="filter-group">
                            <button class="filter-btn active" onclick="filterData('ALL', this)">ALL</button>
                            <button class="filter-btn" onclick="filterData('PENDING', this)">PENDING</button>
                            <button class="filter-btn" onclick="filterData('APPROVED', this)">APPROVED</button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="bg-light">
                                <tr class="text-uppercase small fw-800">
                                    <th>User</th>
                                    <th>Room Details</th>
                                    <th>Schedule</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="daftarBooking"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalRuangan" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 rounded-4 shadow-lg border border-dark border-3">
                <div class="modal-body p-4">
                    <h4 class="fw-800 mb-4">Master Data Ruangan</h4>
                    <form id="roomForm" class="row g-2 mb-4">
                        <div class="col-md-5"><input type="text" id="masterRuangan" class="form-control" placeholder="Nama Ruang" required></div>
                        <div class="col-md-3"><input type="number" id="masterKapasitas" class="form-control" placeholder="Pax" required></div>
                        <div class="col-md-4 d-flex gap-2">
                            <input type="text" id="masterFasilitas" class="form-control" placeholder="Fasilitas">
                            <button type="submit" class="btn btn-dark"><i class="fas fa-plus"></i></button>
                        </div>
                    </form>
                    <table class="table table-sm">
                        <tbody id="listMasterRuangan"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
