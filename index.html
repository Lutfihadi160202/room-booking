<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI | IT OPS - TOTAL SYSTEM V8.5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --neon-blue: #00f2ff; 
            --bg-deep: #020617; 
            --card-glass: rgba(15, 23, 42, 0.9);
            --text-main: #ffffff;
        }

        body { 
            background: var(--bg-deep); color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; margin: 0;
            background-image: radial-gradient(circle at top right, rgba(0, 242, 255, 0.05), transparent);
        }

        /* SIDEBAR */
        .sidebar { 
            width: 280px; position: fixed; height: 100vh; background: #070b17; 
            border-right: 1px solid rgba(0, 242, 255, 0.2); display: flex; flex-direction: column; z-index: 1000;
        }
        .sidebar-header { padding: 2.5rem 1.5rem; }
        .logo-text { font-family: 'Orbitron'; font-weight: 700; color: white; letter-spacing: 2px; }

        .nav-menu { flex-grow: 1; padding: 0 15px; }
        .nav-link { 
            color: #94a3b8 !important; padding: 16px 20px; margin-bottom: 8px; 
            cursor: pointer; text-decoration: none; display: flex; align-items: center; 
            border-radius: 12px; transition: 0.3s; font-weight: 600;
        }
        .nav-link:hover, .nav-link.active { background: rgba(0, 242, 255, 0.1); color: var(--neon-blue) !important; }

        .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-terminate { 
            width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ef4444; 
            color: #ef4444; background: transparent; font-weight: 800; transition: 0.3s;
        }
        .btn-terminate:hover { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239,68,68,0.4); }

        /* CONTENT */
        .main-content { margin-left: 280px; padding: 3rem; transition: 0.3s; }
        .glass-card { 
            background: var(--card-glass); border: 1px solid rgba(0, 242, 255, 0.15); 
            border-radius: 24px; padding: 2rem; backdrop-filter: blur(10px);
        }

        /* FORM CONTROLS - FIX TULISAN GELAP */
        label { color: var(--neon-blue) !important; font-weight: 700; font-size: 0.8rem; margin-bottom: 8px; display: block; }
        .form-control, .form-select { 
            background: #0f172a !important; border: 1px solid #334155 !important; 
            color: #ffffff !important; padding: 12px !important; border-radius: 10px !important;
        }
        /* Style untuk tulisan saat mengetik agar tetap putih */
        input { color: white !important; }

        /* MODAL MASTER - FIX Z-INDEX & TULISAN */
        .modal-content { background: #0f172a !important; border: 2px solid var(--neon-blue) !important; color: white !important; border-radius: 24px; }
        .modal label { color: var(--neon-blue) !important; }

        /* DISPLAY TV OVERLAY (Biar nggak perlu file baru) */
        #tvOverlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #020617; z-index: 9999; padding: 50px; 
        }

        .st-pill { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; background: #22c55e; color: #000; }
    </style>
</head>
<body>

    <div id="tvOverlay">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="logo-text">SBI <span class="text-info">LIVE MONITOR</span></h1>
            <button onclick="closeTV()" class="btn btn-outline-danger">CLOSE MONITOR</button>
        </div>
        <div class="row">
            <div class="col-md-8"><h3 class="text-info mb-4">ACTIVE DEPLOYMENT</h3><div id="tvActiveList"></div></div>
            <div class="col-md-4"><h3 class="text-secondary mb-4">READY NODES</h3><div id="tvReadyList"></div></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3 class="logo-text m-0">SBI <span style="color:var(--neon-blue)">HUB</span></h3>
        </div>
        <div class="nav-menu">
            <div class="nav-link active" onclick="location.reload()"><i class="fas fa-th-large me-3"></i> Dashboard</div>
            <div class="nav-link" onclick="openMaster()"><i class="fas fa-database me-3"></i> Master Nodes</div>
            <div class="nav-link" onclick="openTV()"><i class="fas fa-desktop me-3"></i> TV Monitor</div>
        </div>
        <div class="sidebar-footer">
            <button class="btn-terminate" onclick="handleLogout()"><i class="fas fa-power-off me-2"></i> TERMINATE</button>
        </div>
    </div>

    <div class="main-content">
        <div class="row mb-5 align-items-center">
            <div class="col">
                <h1 class="fw-bold m-0" style="font-size: 2.5rem;">RESOURCE <span style="color:var(--neon-blue)">TRAFFIC</span></h1>
                <p class="text-secondary">Security Infrastructure Control v8.5</p>
            </div>
            <div class="col-auto">
                <div class="glass-card p-3 text-center" style="min-width: 150px; border-color: var(--neon-blue);">
                    <small style="color:var(--neon-blue); font-weight:800;">ACTIVE NODE</small>
                    <h2 class="m-0 fw-bold" id="statCount">0</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4">
                <div class="glass-card">
                    <h5 class="mb-4 fw-bold"><i class="fas fa-bolt me-2 text-info"></i> QUICK DEPLOY</h5>
                    <form id="deployForm">
                        <div class="mb-3">
                            <label>IDENTIFIER / USER</label>
                            <input type="text" id="inpUser" class="form-control" placeholder="User Name..." required>
                        </div>
                        <div class="mb-3">
                            <label>TARGET NODE</label>
                            <select id="inpRoom" class="form-select" onchange="updateInfo()"></select>
                        </div>
                        <div id="roomInfoBox" class="p-3 mb-4 rounded-3 bg-black border border-secondary text-info small fw-bold"></div>
                        <button type="submit" class="btn btn-info w-100 py-3 fw-bold">EXECUTE DEPLOYMENT</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="glass-card">
                    <table class="table table-dark table-hover">
                        <thead><tr><th>IDENTIFIER</th><th>NODE</th><th>STATUS</th><th class="text-end">ACTION</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalMaster" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-5">
                    <div class="d-flex justify-content-between mb-4">
                        <h4 class="logo-text text-info">MASTER DATABASE</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="row">
                        <div class="col-md-5">
                            <label>Node Name</label>
                            <input type="text" id="mName" class="form-control mb-3" placeholder="e.g. War Room">
                            <label>Capacity</label>
                            <input type="text" id="mCap" class="form-control mb-3" placeholder="10 Pax">
                            <label>Facilities</label>
                            <textarea id="mFac" class="form-control mb-4" rows="3" placeholder="Wifi, AC, etc."></textarea>
                            <button onclick="addNode()" class="btn btn-info w-100 fw-bold py-2">SAVE TO DATABASE</button>
                        </div>
                        <div class="col-md-7 border-start border-secondary ps-4">
                            <label>REGISTERED NODES</label>
                            <div id="masterList" style="max-height: 300px; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let db_rooms = JSON.parse(localStorage.getItem('sbi_rooms')) || [{nama:"WAR ROOM", cap:"12 Pax", fac:"Fiber, AC"}];
        let db_logs = JSON.parse(localStorage.getItem('sbi_logs')) || [];

        // --- FUNGSI LOGOUT ---
        function handleLogout() {
            if(confirm("Terminate Session?")) {
                // GANTI "login.html" di bawah ini kalau nama file barcode kamu beda!
                window.location.href = "login.html"; 
            }
        }

        // --- FUNGSI TV DISPLAY ---
        function openTV() {
            document.getElementById('tvOverlay').style.display = 'block';
            document.getElementById('tvActiveList').innerHTML = db_logs.map(l => `
                <div class="p-4 mb-3 bg-dark border-start border-info border-5 rounded-3">
                    <h2 class="text-info m-0">${l.room}</h2>
                    <p class="m-0 text-white">USER: ${l.user}</p>
                </div>
            `).join('') || '<h4 class="text-muted">No Active Session</h4>';
        }
        function closeTV() { document.getElementById('tvOverlay').style.display = 'none'; }

        // --- FUNGSI MASTER DATA ---
        function openMaster() { renderMaster(); new bootstrap.Modal(document.getElementById('modalMaster')).show(); }
        function addNode() {
            const name = document.getElementById('mName').value;
            if(!name) return;
            db_rooms.push({ nama: name.toUpperCase(), cap: document.getElementById('mCap').value, fac: document.getElementById('mFac').value });
            localStorage.setItem('sbi_rooms', JSON.stringify(db_rooms));
            document.getElementById('mName').value = ""; renderMaster(); refresh();
        }
        function renderMaster() {
            document.getElementById('masterList').innerHTML = db_rooms.map((r, i) => `
                <div class="p-3 mb-2 bg-black rounded border border-secondary d-flex justify-content-between align-items-center">
                    <div><b class="text-info">${r.nama}</b><br><small class="text-muted">${r.cap}</small></div>
                    <button class="btn btn-sm btn-outline-danger" onclick="db_rooms.splice(${i},1);localStorage.setItem('sbi_rooms',JSON.stringify(db_rooms));renderMaster();refresh();"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        // --- REFRESH SYSTEM ---
        function refresh() {
            document.getElementById('inpRoom').innerHTML = db_rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            document.getElementById('tableBody').innerHTML = db_logs.map(l => `
                <tr class="border-secondary">
                    <td><b class="text-white">${l.user}</b></td>
                    <td class="text-info fw-bold">${l.room}</td>
                    <td><span class="st-pill">APPROVED</span></td>
                    <td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="db_logs=db_logs.filter(x=>x.id!==${l.id});localStorage.setItem('sbi_logs',JSON.stringify(db_logs));refresh();"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
            document.getElementById('statCount').innerText = db_logs.length;
            updateInfo();
        }

        document.getElementById('deployForm').addEventListener('submit', function(e) {
            e.preventDefault();
            db_logs.unshift({ id: Date.now(), user: document.getElementById('inpUser').value.toUpperCase(), room: document.getElementById('inpRoom').value });
            localStorage.setItem('sbi_logs', JSON.stringify(db_logs));
            this.reset(); refresh();
        });

        function updateInfo() {
            const r = db_rooms.find(x => x.nama === document.getElementById('inpRoom').value);
            document.getElementById('roomInfoBox').innerHTML = r ? `<i class="fas fa-info-circle me-2"></i> ${r.cap} | ${r.fac}` : "Select Node...";
        }

        refresh();
    </script>
</body>
</html>
