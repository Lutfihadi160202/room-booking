<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Room Booking</title>
    <!-- Mengambil desain dari Bootstrap agar langsung rapi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">Sistem Booking Ruang Meeting</h2>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="bookingForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label>Nama Peminjam</label>
                            <input type="text" id="nama" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Pilih Ruangan</label>
                            <select id="ruangan" class="form-select">
                                <option>Ruang Alpha</option>
                                <option>Ruang Beta</option>
                                <option>Ruang Gamma</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Tanggal</label>
                            <input type="date" id="tanggal" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Booking Sekarang</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5>Daftar Reservasi</h5>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Ruangan</th>
                            <th>Tanggal</th>
                        </tr>
                    </thead>
                    <tbody id="daftarBooking"></tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Menyambungkan ke file script.js -->
    <script src="script.js"></script>
</body>
</html>
