<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM.X | IT OPERATIONS HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #00f2ff; --secondary: #7000ff; --bg-deep: #020617; --card-bg: #0f172a; --border: #1e293b; --text-main: #f8fafc; }
        body { background: var(--bg-deep); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.02em; }
        .navbar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 1rem 0; }
        .brand-logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; color: var(--primary); text-shadow: 0 0 15px rgba(0, 242, 255, 0.4); }
        .glass-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; position: relative; overflow: hidden; height: 100%; }
        .glass-card::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; letter-spacing: 0.1em; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; margin-top: 0.5rem; }
        .form-control, .form-select { background: #1e293b; border: 1px solid var(--border); color: white; border-radius: 10px; padding: 10px; font-size: 0.9rem; }
        .form-control:focus, .form-select:focus { background: #1e293b; color: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1); }
        .btn-it { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 10px; font-weight: 700; transition: 0.3s; }
        .btn-it:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 242, 255, 0.3); color: white; }
        .badge-it { padding: 4px 12px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; border: 1px solid currentColor; }
        .status-pending { color: #eab308; } .status-approved { color: #22c55e; } .status-rejected { color: #ef4444; }
        .admin-only { display: none; } /* Hidden by default */
        #qrcode img { margin: 0 auto; border: 5px solid white; border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="navbar sticky-top">
        <div class="container d-flex justify-content-between">
            <div class="brand-logo fs-4">OPS.CENTER/RM-X</div>
            <div class="d-flex gap-2">
                <a href="display.html" target="_blank" class="btn btn-sm btn-outline-info rounded-pill px-3">TV FEED</a>
                <button id="loginBtn" class="btn btn-sm btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#loginModal">ADMIN LOGIN</button>
                <button id="logoutBtn" class="btn btn-sm btn-danger rounded-pill px-4 admin-only" onclick="logout()">LOGOUT</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="glass-card text-center">
                    <div class="stat-label">System Waiting</div>
                    <div class="stat-value" id="statPending" style="color: #eab308">00</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card text-center">
                    <div class="stat-label">Active Bookings</div>
                    <div class="stat-value" id="statApproved" style="color: #22c55e">00</div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="glass-card d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="fw-bold text-primary mb-1">QUICK_ACCESS_SCAN</h6>
                        <p class="small opacity-50 mb-0">Scan barcode ini untuk membagikan<br>link form booking ke user lain.</p>
                    </div>
                    <div id="qrcode"></div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="glass-card">
                    <h5 class="fw-bold mb-4 text-primary"><i class="fas fa-plus-square me-2"></i>RESERVATION_FORM</h5>
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="stat-label">Requester Name</label>
                            <input type="text" id="nama" class="form-control" placeholder="Nama Lengkap" required>
                        </div>
                        <div class="mb-3">
                            <label class="stat-label">Target Room</label>
                            <select id="ruangan" class="form-select" required></select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6"><label class="stat-label">Start Date</label><input type="date" id="tglMulai" class="form-control" required></div>
                            <div class="col-6"><label class="stat-label">End Date</label><input type="date" id="tglSelesai" class="form-control" required></div>
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-6"><label class="stat-label">Start Time</label><input type="time" id="jamMulai" class="form-control" required></div>
                            <div class="col-6"><label class="stat-label">End Time</label><input type="time" id="jamSelesai" class="form-control" required></div>
                        </div>
                        <button type="submit" class="btn btn-it w-100 py-2">SUBMIT REQUEST</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="glass-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold m-0"><i class="fas fa-database me-2 text-primary"></i>TRAFFIC_LOGS</h5>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary active" onclick="filterData('ALL', this)">ALL</button>
                            <button class="btn btn-outline-secondary" onclick="filterData('PENDING', this)">PENDING</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr class="stat-label">
                                    <th>IDENTIFIER</th>
                                    <th>ROOM</th>
                                    <th>SCHEDULE</th>
                                    <th>STATUS</th>
                                    <th class="text-end admin-only">OP</th>
                                </tr>
                            </thead>
                            <tbody id="daftarBooking" style="font-size: 0.85rem;"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content bg-dark border border-primary">
                <div class="modal-body p-4 text-center">
                    <i class="fas fa-lock-open mb-3 text-primary fa-2x"></i>
                    <h6 class="fw-bold mb-3">ADMIN_AUTHENTICATION</h6>
                    <input type="password" id="adminPass" class="form-control text-center mb-3" placeholder="Enter Password">
                    <button class="btn btn-it w-100" onclick="login()">AUTHORIZE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
