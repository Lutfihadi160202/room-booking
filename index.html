<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM.X | IT OPERATIONS HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg-deep: #020617;
            --card-bg: #0f172a;
            --border: #1e293b;
            --text-main: #f8fafc;
        }

        body { 
            background: var(--bg-deep); 
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.02em;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
        }

        .brand-logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 2rem; }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .glass-card::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; letter-spacing: 0.1em; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; font-weight: 700; margin-top: 0.5rem; }

        .form-control, .form-select {
            background: #1e293b;
            border: 1px solid var(--border);
            color: white;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus, .form-select:focus { background: #1e293b; color: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1); }

        .btn-it {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-it:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 242, 255, 0.3); color: white; }

        .table { color: var(--text-main); margin-bottom: 0; }
        .table thead th { border-bottom: 2px solid var(--border); color: #64748b; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .table tbody td { border-bottom: 1px solid var(--border); padding: 1.25rem 0.75rem; }

        .badge-it {
            padding: 4px 12px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; font-family: 'JetBrains Mono', monospace;
        }
        .status-pending { background: rgba(234, 179, 8, 0.1); color: #eab308; border: 1px solid #eab308; }
        .status-approved { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid #22c55e; }
        .status-rejected { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }

        .display-link { background: transparent; border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; text-decoration: none; padding: 6px 15px; font-size: 0.8rem; transition: 0.3s; }
        .display-link:hover { background: var(--primary); color: var(--bg-deep); }
    </style>
</head>
<body>

    <nav class="navbar sticky-top">
        <div class="container d-flex justify-content-between">
            <div class="brand-logo fs-4">OPS.CENTER/RM-X</div>
            <div class="d-flex gap-3">
                <a href="display.html" target="_blank" class="display-link"><i class="fas fa-desktop me-2"></i>TV FEED</a>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalRuangan">CONFIGURATION</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="stats-grid">
            <div class="glass-card">
                <div class="stat-label">System Waiting</div>
                <div class="stat-value" id="statPending" style="color: #eab308">00</div>
            </div>
            <div class="glass-card">
                <div class="stat-label">Active Bookings</div>
                <div class="stat-value" id="statApproved" style="color: #22c55e">00</div>
            </div>
            <div class="glass-card" style="background: linear-gradient(135deg, #0f172a, #1e1b4b)">
                <div class="stat-label">Operational Status</div>
                <div class="stat-value text-primary" style="font-size: 1.5rem">HEALTHY</div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-lg-4">
                <div class="glass-card mb-4">
                    <h5 class="fw-bold mb-4"><i class="fas fa-plus-square me-2 text-primary"></i>NEW REQUEST</h5>
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="stat-label">Requester Name</label>
                            <input type="text" id="nama" class="form-control" placeholder="Input string..." required>
                        </div>
                        <div class="mb-3">
                            <label class="stat-label">Target Room</label>
                            <select id="ruangan" class="form-select" required></select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="stat-label">Start Date</label>
                                <input type="date" id="tglMulai" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="stat-label">End Date</label>
                                <input type="date" id="tglSelesai" class="form-control" required>
                            </div>
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <label class="stat-label">Start Time</label>
                                <input type="time" id="jamMulai" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="stat-label">End Time</label>
                                <input type="time" id="jamSelesai" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-it w-100 py-3">EXECUTE BOOKING</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="glass-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold m-0"><i class="fas fa-database me-2 text-primary"></i>TRAFFIC LOGS</h5>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary active" onclick="filterData('ALL', this)">ALL</button>
                            <button class="btn btn-outline-secondary" onclick="filterData('PENDING', this)">PENDING</button>
                            <button class="btn btn-outline-secondary" onclick="filterData('APPROVED', this)">APPROVED</button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>IDENTIFIER</th>
                                    <th>ROOM_NODE</th>
                                    <th>TIMEFRAME</th>
                                    <th>STATUS_CODE</th>
                                    <th class="text-end">OPERATION</th>
                                </tr>
                            </thead>
                            <tbody id="daftarBooking"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalRuangan" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark border border-secondary">
                <div class="modal-body p-4">
                    <h5 class="fw-bold text-white mb-4">RESOURCE CONFIGURATION</h5>
                    <form id="roomForm" class="row g-2 mb-4">
                        <div class="col-md-5"><input type="text" id="masterRuangan" class="form-control" placeholder="Room Name" required></div>
                        <div class="col-md-3"><input type="number" id="masterKapasitas" class="form-control" placeholder="Capacity" required></div>
                        <div class="col-md-4 d-flex gap-2">
                            <input type="text" id="masterFasilitas" class="form-control" placeholder="Spec">
                            <button type="submit" class="btn btn-it px-3"><i class="fas fa-plus"></i></button>
                        </div>
                    </form>
                    <table class="table table-dark table-sm">
                        <tbody id="listMasterRuangan"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
