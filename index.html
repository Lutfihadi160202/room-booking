<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Room Booking - Office Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border: none; border-radius: 15px; }
        .btn-primary { border-radius: 10px; padding: 10px; font-weight: bold; }
        .btn-success { border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center mb-4 fw-bold text-primary">Sistem Booking Ruang Meeting</h2>
        
        <div class="card shadow mb-4">
            <div class="card-body p-4">
                <form id="bookingForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Nama Peminjam</label>
                            <input type="text" id="nama" class="form-control" placeholder="Masukkan nama Anda" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Pilih Ruangan</label>
                            <select id="ruangan" class="form-select">
                                <option>Ruang Alpha</option>
                                <option>Ruang Beta</option>
                                <option>Ruang Gamma</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Tanggal</label>
                            <input type="date" id="tanggal" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 shadow-sm">Booking Sekarang</button>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0 text-secondary">Daftar Reservasi Kantor</h5>
                    
                    <div class="d-flex gap-2 w-50 justify-content-end">
                        <input type="text" id="cariNama" class="form-control" placeholder="Cari nama..." onkeyup="filterData()">
                        <button onclick="downloadExcel()" class="btn btn-success">Download Excel</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="tabelBooking">
                        <thead class="table-light">
                            <tr>
                                <th>Nama</th>
                                <th>Ruangan</th>
                                <th>Tanggal</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="daftarBooking"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
