<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Booking Pro | Enterprise Edition</title>
    <!-- Bootstrap 5 & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f4f7fa; 
            color: #2d3748;
        }
        .header-section { 
            background: linear-gradient(135deg, #0d6efd 0%, #003d99 100%); 
            border-radius: 20px; 
            padding: 40px 20px; 
            color: white; 
            margin-bottom: -60px; 
            position: relative; 
            z-index: 1; 
        }
        .main-card { 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            background: #ffffff; 
        }
        .stat-card { 
            border: none; 
            border-radius: 15px; 
            transition: transform 0.3s; 
        }
        .stat-card:hover { transform: translateY(-5px); }
        .btn-primary { 
            border-radius: 12px; 
            padding: 12px; 
            font-weight: 700; 
            background: #0d6efd; 
            border: none; 
            transition: 0.3s;
        }
        .btn-primary:hover { background: #0056b3; transform: scale(1.01); }
        .form-control, .form-select { 
            border-radius: 10px; 
            padding: 12px; 
            border: 1px solid #e2e8f0; 
        }
        .badge-status { 
            padding: 6px 12px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.8rem; 
        }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 15px; top: 13px; color: #94a3b8; }
        .search-box input { padding-left: 40px; border-radius: 25px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Header -->
        <div class="header-section shadow-lg text-center">
            <h2 class="fw-bold mb-1"><i class="fas fa-building me-2"></i>Sistem Booking Ruang Meeting</h2>
            <p class="opacity-75 mb-0 text-white">Kelola reservasi rapat kantor dengan efisien dan profesional</p>
        </div>

        <!-- Dashboard Stats -->
        <div class="row g-3 pt-5 mt-4 mb-4">
            <div class="col-md-4">
                <div class="card stat-card bg-primary text-white shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h6 class="small fw-bold opacity-75">TOTAL BOOKING</h6>
                            <h3 class="fw-bold m-0" id="statTotal">0</h3>
                        </div>
                        <i class="fas fa-book-open fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-warning text-dark shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h6 class="small fw-bold opacity-75">STATUS MENUNGGU</h6>
                            <h3 class="fw-bold m-0" id="statPending">0</h3>
                        </div>
                        <i class="fas fa-hourglass-half fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-success text-white shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h6 class="small fw-bold opacity-75">AGENDA HARI INI</h6>
                            <h3 class="fw-bold m-0" id="statToday">0</h3>
                        </div>
                        <i class="fas fa-calendar-check fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form & Table Content -->
        <div class="row g-4">
            <!-- Sidebar Form -->
            <div class="col-lg-4">
                <div class="card main-card h-100">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4 border-bottom pb-2 text-primary">Buat Reservasi</h5>
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Nama Peminjam</label>
                                <input type="text" id="nama" class="form-control shadow-sm" placeholder="Masukkan nama Anda" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Pilih Ruangan</label>
                                <select id="ruangan" class="form-select shadow-sm">
                                    <option>Ruang Alpha (Lantai 1)</option>
                                    <option>Ruang Beta (Lantai 2)</option>
                                    <option>Ruang Gamma (VVIP)</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small">Tanggal Rapat</label>
                                <input type="date" id="tanggal" class="form-control shadow-sm" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                                <i class="fas fa-paper-plane me-2"></i>Konfirmasi Booking
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="col-lg-8">
                <div class="card main-card h-100">
                    <div class="card-body p-4">
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                            <h5 class="fw-bold m-0 text-secondary">Daftar Reservasi Kantor</h5>
                            <button onclick="downloadExcel()" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">
                                <i class="fas fa-file-excel me-2"></i>Download Excel
                            </button>
                        </div>
                        
                        <div class="search-box mb-4">
                            <i class="fas fa-search"></i>
                            <input type="text" id="cariNama" class="form-control shadow-sm" placeholder="Cari nama peminjam..." onkeyup="filterData()">
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light small">
                                    <tr>
                                        <th>PEMINJAM</th>
                                        <th>RUANGAN</th>
                                        <th>TANGGAL</th>
                                        <th>STATUS</th>
                                        <th class="text-center">AKSI</th>
                                    </tr>
                                </thead>
                                <tbody id="daftarBooking"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
