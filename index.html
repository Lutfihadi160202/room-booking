<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM.X | IT OPERATIONS FULL HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #00f2ff; --secondary: #7000ff; --bg-deep: #020617; --card-bg: #0f172a; --border: #1e293b; --text-bright: #ffffff; }
        body { background: var(--bg-deep); color: var(--text-bright); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; }

        /* --- GATEWAY STYLE --- */
        #gatewayPage { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #111827 0%, #020617 100%); }
        .gateway-card { background: #0f172a; border: 2px solid var(--border); padding: 2.5rem; border-radius: 28px; width: 420px; box-shadow: 0 0 60px rgba(0, 242, 255, 0.15); text-align: center; }
        
        /* --- DASHBOARD STYLE --- */
        #dashboardPage { display: none; }
        .sidebar { width: 280px; position: fixed; height: 100vh; background: #070b17; border-right: 1px solid var(--border); padding: 2rem; z-index: 100; }
        .main-content { margin-left: 280px; padding: 2.5rem; }

        .glass-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; position: relative; margin-bottom: 1.5rem; }
        .glass-card::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
        
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; color: var(--primary); }
        .form-label-custom { color: var(--primary); font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
        
        .form-control, .form-select { background: #1e293b !important; border: 1px solid var(--border) !important; color: white !important; border-radius: 10px; font-size: 0.9rem; }
        .btn-it { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; font-weight: 800; border-radius: 10px; padding: 12px; width: 100%; transition: 0.3s; }
        
        .badge-room { background: rgba(0, 242, 255, 0.1); color: var(--primary); border: 1px solid var(--primary); font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; }
        
        /* Calendar Mini Style */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .cal-day { background: #1e293b; aspect-ratio: 1; border-radius: 6px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; color: #64748b; }
        .cal-booked { background: var(--secondary); color: white; box-shadow: 0 0 10px rgba(112, 0, 255, 0.5); }
    </style>
</head>
<body>

    <div id="gatewayPage">
        <div class="gateway-card">
            <h2 style="font-family:'JetBrains Mono'; color:var(--primary); font-weight:800">RM.X / OPS</h2>
            <p style="font-size:0.7rem; color:#64748b; letter-spacing:2px" class="mb-4">AUTHENTICATION REQUIRED</p>
            <input type="text" id="adminUser" class="form-control mb-3" placeholder="Username">
            <input type="password" id="adminPass" class="form-control mb-4" placeholder="Password">
            <button onclick="prosesLogin()" class="btn btn-it mb-4">ENTER SYSTEM</button>
            <div style="border-top: 1px dashed #334155; padding-top: 20px;">
                <span style="color:var(--primary); font-weight:800; font-size:0.8rem">ANDA USER? SCAN DISINI</span><br>
                <div id="qrcode" class="mt-3 bg-white p-2 d-inline-block rounded-3"></div>
            </div>
        </div>
    </div>

    <div id="dashboardPage">
        <div class="sidebar d-flex flex-column">
            <h4 style="color:var(--primary); font-weight:800" class="mb-5">OPS.CENTER</h4>
            <div class="mb-auto">
                <a href="#" class="btn btn-sm btn-outline-info w-100 mb-3 text-start"><i class="fas fa-chart-line me-2"></i> Dashboard</a>
                <a href="display.html" class="btn btn-sm btn-outline-light w-100 mb-3 text-start"><i class="fas fa-tv me-2"></i> Monitor Display</a>
            </div>
            <button onclick="location.reload()" class="btn btn-danger btn-sm w-100">TERMINATE SESSION</button>
        </div>

        <div class="main-content">
            <div class="row g-4 mb-4">
                <div class="col-md-3"><div class="glass-card text-center"><small class="stat-label">Waiting</small><div class="stat-value" id="statPending">0</div></div></div>
                <div class="col-md-3"><div class="glass-card text-center"><small class="stat-label">Approved</small><div class="stat-value text-success" id="statApproved">0</div></div></div>
                <div class="col-md-6">
                    <div class="glass-card py-3">
                        <small class="stat-label">Booking Schedule (Current Month)</small>
                        <div class="calendar-grid" id="miniCalendar"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-5">
                    <div class="glass-card">
                        <h6 class="fw-bold mb-4 text-primary"><i class="fas fa-calendar-plus me-2"></i>RESERVATION HUB</h6>
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label-custom">Requester Name</label>
                                <input type="text" id="nama" class="form-control" placeholder="Nama Lengkap..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label-custom">Target Room (Fasilitas & Kapasitas)</label>
                                <select id="ruangan" class="form-select" onchange="updateRoomInfo()" required></select>
                                <div id="roomDetail" class="mt-2 small opacity-75"></div>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6"><label class="form-label-custom">Start Date</label><input type="date" id="tglMulai" class="form-control" required></div>
                                <div class="col-6"><label class="form-label-custom">End Date</label><input type="date" id="tglSelesai" class="form-control" required></div>
                            </div>
                            <div class="row g-2 mb-4">
                                <div class="col-6"><label class="form-label-custom">Start Time</label><input type="time" id="jamMulai" class="form-control" required></div>
                                <div class="col-6"><label class="form-label-custom">End Time</label><input type="time" id="jamSelesai" class="form-control" required></div>
                            </div>
                            <button type="submit" class="btn btn-it">EXECUTE RESERVATION</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="glass-card">
                        <h6 class="fw-bold mb-4 text-primary"><i class="fas fa-database me-2"></i>TRAFFIC_LOGS</h6>
                        <div class="table-responsive">
                            <table class="table table-dark table-hover small">
                                <thead>
                                    <tr class="text-muted"><th>USER</th><th>ROOM</th><th>SCHEDULE</th><th>STATUS</th><th class="text-end">OP</th></tr>
                                </thead>
                                <tbody id="daftarBooking"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycby9yG2ivGODdSAzLLS8fHJM9U82mf4sJRnjbtg7GL_AQbNyZSoT3OgNzckAdMQZ9Qa9/exec';
        
        const roomData = [
            { nama: "VIP Executive", cap: "8 Pax", facility: "AC, Smart TV, Glass Board" },
            { nama: "Server Room A", cap: "3 Pax", facility: "Rack Access, Cooling High" },
            { nama: "War Room IT", cap: "15 Pax", facility: "Projector, Audio System, High Speed LAN" }
        ];

        window.onload = () => {
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href + "?mode=user", 
                width: 130, height: 130
            });
            renderCalendar();
        };

        function renderCalendar() {
            const grid = document.getElementById('miniCalendar');
            let db = JSON.parse(localStorage.getItem('it_hub_db')) || [];
            let bookedDays = db.map(i => new Date(i.tglMulai).getDate());
            
            grid.innerHTML = '';
            for(let i=1; i<=31; i++) {
                let isBooked = bookedDays.includes(i);
                grid.innerHTML += `<div class="cal-day ${isBooked ? 'cal-booked' : ''}">${i}</div>`;
            }
        }

        function prosesLogin() {
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            if(u === "admin" && p === "admin123") {
                document.getElementById('gatewayPage').style.display = 'none';
                document.getElementById('dashboardPage').style.display = 'block';
                initDashboard();
            } else { alert("Akses Ditolak!"); }
        }

        function initDashboard() {
            const select = document.getElementById('ruangan');
            select.innerHTML = roomData.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            updateRoomInfo();
            tampilkanData();
        }

        function updateRoomInfo() {
            const selected = roomData.find(r => r.nama === document.getElementById('ruangan').value);
            document.getElementById('roomDetail').innerHTML = `
                <span class="badge-room">${selected.cap}</span> 
                <span class="ms-2"><i class="fas fa-tools me-1"></i>${selected.facility}</span>
            `;
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                nama: document.getElementById('nama').value,
                ruangan: document.getElementById('ruangan').value,
                tglMulai: document.getElementById('tglMulai').value,
                tglSelesai: document.getElementById('tglSelesai').value,
                jamMulai: document.getElementById('jamMulai').value,
                jamSelesai: document.getElementById('jamSelesai').value,
                status: "PENDING"
            };
            let db = JSON.parse(localStorage.getItem('it_hub_db')) || [];
            db.unshift(data);
            localStorage.setItem('it_hub_db', JSON.stringify(db));
            this.reset();
            tampilkanData();
            renderCalendar();
        });

        function tampilkanData() {
            let db = JSON.parse(localStorage.getItem('it_hub_db')) || [];
            const list = document.getElementById('daftarBooking');
            list.innerHTML = db.map((item, idx) => `
                <tr class="align-middle">
                    <td><div class="fw-bold text-uppercase">${item.nama}</div><div class="text-muted" style="font-size:0.6rem">ID-10${idx}</div></td>
                    <td><span class="text-info">${item.ruangan}</span></td>
                    <td><div style="font-size:0.7rem">${item.tglMulai}</div><div class="fw-bold text-primary">${item.jamMulai} - ${item.jamSelesai}</div></td>
                    <td><span class="badge bg-${item.status === 'PENDING' ? 'warning' : 'success'} text-dark" style="font-size:0.6rem">${item.status}</span></td>
                    <td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="hapus(${idx})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
            document.getElementById('statPending').innerText = db.filter(b => b.status === 'PENDING').length;
            document.getElementById('statApproved').innerText = db.filter(b => b.status === 'APPROVED').length;
        }

        function hapus(idx) {
            let db = JSON.parse(localStorage.getItem('it_hub_db'));
            db.splice(idx, 1);
            localStorage.setItem('it_hub_db', JSON.stringify(db));
            tampilkanData();
            renderCalendar();
        }
    </script>
</body>
</html>
