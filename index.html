<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM.X | IT OPERATIONS HUB V3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #00f2ff; --secondary: #7000ff; --success: #22c55e; --danger: #ef4444; --bg: #020617; --card: rgba(15, 23, 42, 0.8); --border: #1e293b; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; background-image: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #020617 80%); }

        /* --- LOGIN PAGE (ULTRA BRIGHT) --- */
        #gatewayPage { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .gateway-card { 
            background: #0f172a; border: 2px solid var(--primary); padding: 3rem; border-radius: 30px; width: 420px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2); backdrop-filter: blur(10px);
        }
        .login-label { color: var(--primary); font-weight: 800; font-size: 0.75rem; text-transform: uppercase; display: block; text-align: left; margin-bottom: 8px; letter-spacing: 1.5px; }

        /* --- SIDEBAR --- */
        #dashboardPage { display: none; }
        .sidebar { width: 260px; position: fixed; height: 100vh; background: rgba(7, 11, 23, 0.9); border-right: 1px solid var(--border); padding: 2rem; backdrop-filter: blur(15px); z-index: 1000; }
        .main-content { margin-left: 260px; padding: 2rem; }

        /* --- CARDS & UI --- */
        .glass-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; backdrop-filter: blur(10px); transition: 0.3s; }
        .glass-card:hover { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.1); }
        
        .form-control, .form-select { background: rgba(30, 41, 59, 0.7) !important; border: 1px solid var(--border) !important; color: white !important; padding: 12px; border-radius: 12px; }
        .form-control:focus { border-color: var(--primary) !important; box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }

        .btn-it { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; font-weight: 800; border-radius: 12px; padding: 12px; transition: 0.3s; }
        .btn-it:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(112, 0, 255, 0.4); }

        /* --- MODERN MINI CALENDAR --- */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; border-radius: 8px; background: #1e293b; color: #64748b; font-weight: 600; }
        .cal-booked { background: var(--secondary); color: white; position: relative; }
        .cal-booked::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; background: var(--primary); border-radius: 50%; }

        /* --- TABLE STYLE --- */
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .status-pending { background: rgba(234, 179, 8, 0.1); color: #eab308; border: 1px solid #eab308; }
        .status-approved { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid #22c55e; }
        .status-rejected { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }

        .sidebar-link { color: #94a3b8; text-decoration: none; padding: 12px; border-radius: 12px; display: block; margin-bottom: 5px; transition: 0.3s; cursor: pointer; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(0, 242, 255, 0.1); color: var(--primary); }
    </style>
</head>
<body>

    <div id="gatewayPage">
        <div class="gateway-card">
            <h2 class="fw-bolder mb-1" style="font-family:'JetBrains Mono'; color:var(--primary); letter-spacing:-1px">RM.X / OPS</h2>
            <p class="text-muted small mb-5">SECURE ADMINISTRATOR GATEWAY</p>
            
            <div class="mb-3">
                <label class="login-label text-white">ADMIN USERNAME</label>
                <input type="text" id="adminUser" class="form-control form-control-lg" placeholder="Enter ID...">
            </div>
            <div class="mb-5">
                <label class="login-label text-white">SECURITY TOKEN</label>
                <input type="password" id="adminPass" class="form-control form-control-lg" placeholder="••••••••">
            </div>
            
            <button onclick="prosesLogin()" class="btn btn-it w-100 py-3 mb-4">ACCESS DASHBOARD</button>

            <div class="pt-4 border-top border-secondary">
                <p class="text-info fw-bold small mb-3">USER QUICK ACCESS</p>
                <div id="qrcode" class="bg-white p-2 d-inline-block rounded-4"></div>
            </div>
        </div>
    </div>

    <div id="dashboardPage">
        <div class="sidebar">
            <h4 class="text-info fw-bold mb-5" style="letter-spacing: 2px;">OPS.CENTER</h4>
            <div class="sidebar-link active" onclick="location.reload()"><i class="fas fa-th-large me-2"></i> Dashboard</div>
            <div class="sidebar-link" onclick="window.open('display.html')"><i class="fas fa-tv me-2"></i> Monitor Display</div>
            <div class="sidebar-link" onclick="showModal()"><i class="fas fa-plus-circle me-2"></i> Add Node/Room</div>
            
            <div class="mt-auto pt-5">
                <button onclick="location.reload()" class="btn btn-outline-danger btn-sm w-100">TERMINATE SESSION</button>
            </div>
        </div>

        <div class="main-content">
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="glass-card text-center p-3">
                        <small class="login-label text-center m-0">Waiting</small>
                        <h2 class="fw-bold m-0 text-warning" id="statPending">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card text-center p-3">
                        <small class="login-label text-center m-0">Approved</small>
                        <h2 class="fw-bold m-0 text-success" id="statApproved">0</h2>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="glass-card p-3 d-flex align-items-center justify-content-between">
                        <div class="w-50">
                            <small class="login-label m-0">Calendar Activity</small>
                            <p class="text-muted small m-0">Real-time scheduling monitor</p>
                        </div>
                        <div class="calendar-grid flex-grow-1" id="miniCalendar" style="max-width: 200px;"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <div class="glass-card">
                        <h6 class="text-primary fw-bold mb-4"><i class="fas fa-bolt me-2"></i>QUICK RESERVATION</h6>
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="login-label">Requester Name</label>
                                <input type="text" id="nama" class="form-control" placeholder="Input User..." required>
                            </div>
                            <div class="mb-3">
                                <label class="login-label">Assign Node</label>
                                <select id="ruangan" class="form-select" onchange="updateRoomInfo()" required></select>
                                <div id="roomDetail" class="small mt-2 text-info opacity-75"></div>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6"><label class="login-label">Start Date</label><input type="date" id="tglMulai" class="form-control" required></div>
                                <div class="col-6"><label class="login-label">End Date</label><input type="date" id="tglSelesai" class="form-control" required></div>
                            </div>
                            <div class="row g-2 mb-4">
                                <div class="col-6"><label class="login-label">Start Time</label><input type="time" id="jamMulai" class="form-control" required></div>
                                <div class="col-6"><label class="login-label">End Time</label><input type="time" id="jamSelesai" class="form-control" required></div>
                            </div>
                            <button type="submit" class="btn btn-it w-100">DEPLOY REQUEST</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="glass-card">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h6 class="text-primary fw-bold m-0 text-uppercase"><i class="fas fa-stream me-2"></i>Traffic Logs</h6>
                            <span class="text-muted" style="font-size: 0.6rem;">REALTIME DATABASE ACTIVE</span>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-dark table-hover align-middle small">
                                <thead>
                                    <tr class="text-muted border-secondary">
                                        <th>IDENTIFIER</th><th>ROOM</th><th>SCHEDULE</th><th>APPROVAL</th><th>OP</th>
                                    </tr>
                                </thead>
                                <tbody id="daftarBooking" class="border-0"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="roomModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-info">
                <div class="modal-header border-secondary text-info">Add New Node</div>
                <div class="modal-body">
                    <label class="login-label">Node Name</label><input type="text" id="newRoomName" class="form-control mb-3">
                    <label class="login-label">Capacity</label><input type="text" id="newRoomCap" class="form-control mb-3">
                    <label class="login-label">Facility</label><input type="text" id="newRoomFac" class="form-control mb-3">
                </div>
                <div class="modal-footer border-secondary">
                    <button onclick="addRoom()" class="btn btn-it w-100">SAVE NODE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let rooms = JSON.parse(localStorage.getItem('it_rooms_v3')) || [
            { nama: "VIP Executive", cap: "8 Pax", facility: "AC, Smart TV" },
            { nama: "War Room", cap: "20 Pax", facility: "Fiber, Projector" }
        ];

        window.onload = () => {
            new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 140, height: 140 });
        };

        function showModal() { new bootstrap.Modal(document.getElementById('roomModal')).show(); }

        function prosesLogin() {
            if(document.getElementById('adminUser').value === "admin" && document.getElementById('adminPass').value === "admin123") {
                document.getElementById('gatewayPage').style.display = 'none';
                document.getElementById('dashboardPage').style.display = 'block';
                refreshRooms(); tampilkanData(); renderCalendar();
            } else { alert("INVALID CREDENTIALS"); }
        }

        function addRoom() {
            rooms.push({ nama: document.getElementById('newRoomName').value, cap: document.getElementById('newRoomCap').value, facility: document.getElementById('newRoomFac').value });
            localStorage.setItem('it_rooms_v3', JSON.stringify(rooms));
            refreshRooms(); bootstrap.Modal.getInstance(document.getElementById('roomModal')).hide();
        }

        function refreshRooms() {
            document.getElementById('ruangan').innerHTML = rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            updateRoomInfo();
        }

        function updateRoomInfo() {
            const sel = rooms.find(r => r.nama === document.getElementById('ruangan').value);
            document.getElementById('roomDetail').innerHTML = `Cap: ${sel.cap} | Fac: ${sel.facility}`;
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                id: Date.now(),
                nama: document.getElementById('nama').value,
                ruangan: document.getElementById('ruangan').value,
                tglMulai: document.getElementById('tglMulai').value,
                jamMulai: document.getElementById('jamMulai').value,
                jamSelesai: document.getElementById('jamSelesai').value,
                status: "PENDING"
            };
            let db = JSON.parse(localStorage.getItem('it_db_v3')) || [];
            db.unshift(data);
            localStorage.setItem('it_db_v3', JSON.stringify(db));
            this.reset(); tampilkanData(); renderCalendar();
        });

        function changeStatus(id, newStatus) {
            let db = JSON.parse(localStorage.getItem('it_db_v3'));
            const index = db.findIndex(item => item.id === id);
            db[index].status = newStatus;
            localStorage.setItem('it_db_v3', JSON.stringify(db));
            tampilkanData();
        }

        function tampilkanData() {
            let db = JSON.parse(localStorage.getItem('it_db_v3')) || [];
            document.getElementById('daftarBooking').innerHTML = db.map((item) => `
                <tr>
                    <td><div class="fw-bold">${item.nama.toUpperCase()}</div><small class="text-muted">UID-${item.id.toString().slice(-4)}</small></td>
                    <td class="text-info fw-semibold">${item.ruangan}</td>
                    <td><div class="fw-bold text-primary">${item.jamMulai} - ${item.jamSelesai}</div><small class="text-muted">${item.tglMulai}</small></td>
                    <td>
                        <span class="status-pill status-${item.status.toLowerCase()}" onclick="cycleStatus(${item.id}, '${item.status}')">${item.status}</span>
                    </td>
                    <td class="text-end"><button class="btn btn-sm text-danger" onclick="hapus(${item.id})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
            document.getElementById('statPending').innerText = db.filter(b => b.status === 'PENDING').length;
            document.getElementById('statApproved').innerText = db.filter(b => b.status === 'APPROVED').length;
        }

        function cycleStatus(id, current) {
            const next = current === 'PENDING' ? 'APPROVED' : (current === 'APPROVED' ? 'REJECTED' : 'PENDING');
            changeStatus(id, next);
        }

        function renderCalendar() {
            const grid = document.getElementById('miniCalendar');
            let db = JSON.parse(localStorage.getItem('it_db_v3')) || [];
            let booked = db.filter(i => i.status === 'APPROVED').map(i => new Date(i.tglMulai).getDate());
            grid.innerHTML = '';
            for(let i=1; i<=31; i++) grid.innerHTML += `<div class="cal-day ${booked.includes(i)?'cal-booked':''}">${i}</div>`;
        }

        function hapus(id) {
            let db = JSON.parse(localStorage.getItem('it_db_v3')).filter(i => i.id !== id);
            localStorage.setItem('it_db_v3', JSON.stringify(db));
            tampilkanData(); renderCalendar();
        }
    </script>
</body>
</html>
