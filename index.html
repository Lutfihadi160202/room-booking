<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Booking Pro | Enterprise Edition</title>
    <!-- Bootstrap 5 & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7fa; color: #2d3748; }
        .header-section { background: linear-gradient(135deg, #0d6efd 0%, #003d99 100%); border-radius: 20px; padding: 40px 20px; color: white; margin-bottom: -60px; position: relative; z-index: 1; }
        .main-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: #ffffff; }
        .stat-card { border: none; border-radius: 15px; transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .btn-primary { border-radius: 12px; padding: 12px; font-weight: 700; background: #0d6efd; border: none; }
        .form-control, .form-select { border-radius: 10px; padding: 10px; border: 1px solid #e2e8f0; font-size: 0.9rem; }
        .badge-info-custom { background: #e0eaff; color: #0d6efd; border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; font-weight: 600; }
        .time-label { font-size: 0.75rem; color: #64748b; margin-bottom: 2px; display: block; font-weight: 600; }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 15px; top: 13px; color: #94a3b8; }
        .search-box input { padding-left: 40px; border-radius: 25px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="header-section shadow-lg text-center">
            <h2 class="fw-bold mb-1"><i class="fas fa-building me-2"></i>Sistem Booking & Fasilitas</h2>
            <p class="opacity-75 mb-0 text-white">Manajemen reservasi dengan detail kapasitas dan waktu</p>
        </div>

        <div class="row g-3 pt-5 mt-4 mb-4">
            <div class="col-md-4">
                <div class="card stat-card bg-primary text-white shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h6 class="small fw-bold opacity-75">TOTAL BOOKING</h6>
                            <h3 class="fw-bold m-0" id="statTotal">0</h3>
                        </div>
                        <i class="fas fa-book-open fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-warning text-dark shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h6 class="small fw-bold opacity-75">STATUS MENUNGGU</h6>
                            <h3 class="fw-bold m-0" id="statPending">0</h3>
                        </div>
                        <i class="fas fa-hourglass-half fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-success text-white shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h6 class="small fw-bold opacity-75">AGENDA HARI INI</h6>
                            <h3 class="fw-bold m-0" id="statToday">0</h3>
                        </div>
                        <i class="fas fa-calendar-check fa-2x opacity-25"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card main-card h-100">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4 border-bottom pb-2 text-primary">Buat Reservasi</h5>
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Nama Peminjam</label>
                                <input type="text" id="nama" class="form-control shadow-sm" placeholder="Nama Lengkap" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Pilih Ruangan</label>
                                <select id="ruangan" class="form-select shadow-sm">
                                    <option value="Ruang Alpha" data-cap="10" data-fas="Projector, AC, Board">Ruang Alpha (Lantai 1)</option>
                                    <option value="Ruang Beta" data-cap="25" data-fas="Smart TV, Sound, AC">Ruang Beta (Lantai 2)</option>
                                    <option value="Ruang Gamma" data-cap="50" data-fas="LED Screen, Mic, AC">Ruang Gamma (VVIP)</option>
                                </select>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <span class="time-label">Tgl Mulai</span>
                                    <input type="date" id="tglMulai" class="form-control shadow-sm" required>
                                </div>
                                <div class="col-6">
                                    <span class="time-label">Tgl Selesai</span>
                                    <input type="date" id="tglSelesai" class="form-control shadow-sm" required>
                                </div>
                            </div>
                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <span class="time-label">Jam Mulai</span>
                                    <input type="time" id="jamMulai" class="form-control shadow-sm" required>
                                </div>
                                <div class="col-6">
                                    <span class="time-label">Jam Selesai</span>
                                    <input type="time" id="jamSelesai" class="form-control shadow-sm" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                                <i class="fas fa-paper-plane me-2"></i>Konfirmasi Booking
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card main-card h-100">
                    <div class="card-body p-4">
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                            <h5 class="fw-bold m-0 text-secondary">Daftar Jadwal Kantor</h5>
                            <button onclick="downloadExcel()" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">
                                <i class="fas fa-file-excel me-2"></i>Export Excel
                            </button>
                        </div>
                        <div class="search-box mb-4">
                            <i class="fas fa-search"></i>
                            <input type="text" id="cariNama" class="form-control shadow-sm" placeholder="Cari peminjam..." onkeyup="filterData()">
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light small">
                                    <tr>
                                        <th>PEMINJAM</th>
                                        <th>RUANGAN & FASILITAS</th>
                                        <th>WAKTU & DURASI</th>
                                        <th class="text-center">AKSI</th>
                                    </tr>
                                </thead>
                                <tbody id="daftarBooking"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Script terpisah -->
    <script src="script.js"></script>
</body>
</html>
