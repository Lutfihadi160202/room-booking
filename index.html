<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM.X | IT OPERATIONS GATEWAY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #00f2ff; --secondary: #7000ff; --bg-deep: #020617; --card-bg: #0f172a; --border: #1e293b; --text-main: #f8fafc; }
        body { background: var(--bg-deep); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; }

        /* --- HALAMAN LOGIN & BARCODE (GATEWAY) --- */
        #gatewayPage {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }
        .gateway-card {
            background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border);
            padding: 2.5rem; border-radius: 24px; width: 100%; max-width: 420px;
            backdrop-filter: blur(15px); box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
            text-align: center;
        }
        .user-section { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed var(--border); }
        #qrcode { background: white; padding: 10px; border-radius: 12px; display: inline-block; margin: 15px 0; }

        /* --- HALAMAN DASHBOARD (HIDDEN BY DEFAULT) --- */
        #dashboardPage { display: none; }
        .sidebar { width: 280px; position: fixed; height: 100vh; background: #070b17; border-right: 1px solid var(--border); padding: 2rem; }
        .main-content { margin-left: 280px; padding: 2.5rem; }

        /* UI Elements */
        .glass-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; position: relative; overflow: hidden; margin-bottom: 1.5rem; }
        .glass-card::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; letter-spacing: 0.1em; display: block; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--primary); }
        .form-control, .form-select { background: #1e293b; border: 1px solid var(--border); color: white; border-radius: 10px; padding: 10px; }
        .btn-it { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; font-weight: 800; border-radius: 12px; padding: 12px; transition: 0.3s; }
        .btn-it:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 242, 255, 0.3); }
        .badge-it { padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; font-family: 'JetBrains Mono'; border: 1px solid currentColor; }
        .status-pending { color: #eab308; } .status-approved { color: #22c55e; } .status-rejected { color: #ef4444; }
    </style>
</head>
<body>

    <div id="gatewayPage">
        <div class="gateway-card">
            <h2 class="fw-bold text-info mb-1" style="font-family: 'JetBrains Mono'">RM.X / OPS</h2>
            <p class="text-muted small mb-4">ADMINISTRATOR AUTHENTICATION</p>
            
            <div class="text-start mb-3">
                <input type="text" id="adminUser" class="form-control mb-2" placeholder="Username">
                <input type="password" id="adminPass" class="form-control" placeholder="Password">
            </div>
            <button onclick="prosesLogin()" class="btn btn-it w-100">ENTER DASHBOARD</button>

            <div class="user-section">
                <h6 class="text-primary fw-bold small">ANDA USER? SCAN BARCODE DISINI</h6>
                <div id="qrcode"></div>
                <p class="text-muted small mb-0">Scan untuk langsung mengisi form booking</p>
            </div>
        </div>
    </div>

    <div id="dashboardPage">
        <div class="sidebar d-flex flex-column">
            <div class="brand-logo fs-4 fw-bold text-info mb-5">OPS.CENTER</div>
            <div class="mb-auto">
                <p class="stat-label text-white-50">SYSTEM_NAV</p>
                <div class="nav flex-column">
                    <a href="#" class="nav-link text-white px-0 py-2 active"><i class="fas fa-th-large me-2"></i> Dashboard</a>
                    <a href="display.html" class="nav-link text-white-50 px-0 py-2"><i class="fas fa-tv me-2"></i> TV Display</a>
                </div>
            </div>
            <button onclick="location.reload()" class="btn btn-outline-danger btn-sm w-100">LOGOUT</button>
        </div>

        <div class="main-content">
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="glass-card text-center">
                        <span class="stat-label">Pending Review</span>
                        <div class="stat-value" id="statPending">00</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card text-center">
                        <span class="stat-label">Active Approved</span>
                        <div class="stat-value" id="statApproved" style="color: #22c55e">00</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card text-center">
                        <span class="stat-label">Node Status</span>
                        <div class="stat-value text-info" style="font-size: 1.2rem; margin-top: 10px;">OPERATIONAL</div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <div class="glass-card">
                        <h6 class="fw-bold mb-4 text-primary"><i class="fas fa-plus-circle me-2"></i>ADD_RESERVATION</h6>
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="stat-label">Requester</label>
                                <input type="text" id="nama" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="stat-label">Room</label>
                                <select id="ruangan" class="form-select" required></select>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6"><label class="stat-label">Start</label><input type="date" id="tglMulai" class="form-control" required></div>
                                <div class="col-6"><label class="stat-label">End</label><input type="date" id="tglSelesai" class="form-control" required></div>
                            </div>
                            <div class="row g-2 mb-4">
                                <div class="col-6"><input type="time" id="jamMulai" class="form-control" required></div>
                                <div class="col-6"><input type="time" id="jamSelesai" class="form-control" required></div>
                            </div>
                            <button type="submit" class="btn btn-it w-100">SUBMIT_LOG</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="glass-card">
                        <h6 class="fw-bold mb-4 text-primary"><i class="fas fa-database me-2"></i>RESOURCE_LOGS</h6>
                        <div class="table-responsive">
                            <table class="table table-dark">
                                <thead class="stat-label">
                                    <tr><th>IDENTIFIER</th><th>ROOM</th><th>TIME</th><th>STATUS</th><th class="text-end">OP</th></tr>
                                </thead>
                                <tbody id="daftarBooking" style="font-size: 0.8rem;"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycby9yG2ivGODdSAzLLS8fHJM9U82mf4sJRnjbtg7GL_AQbNyZSoT3OgNzckAdMQZ9Qa9/exec';
        
        let rooms = [{nama:"SERVER ROOM A"}, {nama:"WAR ROOM"}, {nama:"LAB NETWORKING"}];

        // --- 1. LOGIN & QR GENERATOR ---
        window.onload = () => {
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href + "?mode=user", 
                width: 140, height: 140
            });
            // Auto login jika link dari barcode discan (simulasi saja)
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('mode') === 'user') {
                document.getElementById('gatewayPage').style.display = 'none';
                document.getElementById('dashboardPage').style.display = 'block';
                mulaiAplikasi();
            }
        };

        function prosesLogin() {
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            if(u === "admin" && p === "admin123") {
                document.getElementById('gatewayPage').style.display = 'none';
                document.getElementById('dashboardPage').style.display = 'block';
                mulaiAplikasi();
            } else { alert("Akses Ditolak!"); }
        }

        // --- 2. DASHBOARD LOGIC ---
        function mulaiAplikasi() {
            const select = document.getElementById('ruangan');
            select.innerHTML = rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            tampilkanData();
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                nama: document.getElementById('nama').value,
                ruangan: document.getElementById('ruangan').value,
                tglMulai: document.getElementById('tglMulai').value,
                tglSelesai: document.getElementById('tglSelesai').value,
                jamMulai: document.getElementById('jamMulai').value,
                jamSelesai: document.getElementById('jamSelesai').value,
                status: "PENDING"
            };

            let bookings = JSON.parse(localStorage.getItem('rx_db')) || [];
            bookings.unshift(data);
            localStorage.setItem('rx_db', JSON.stringify(bookings));
            
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            this.reset();
            tampilkanData();
        });

        function tampilkanData() {
            let bookings = JSON.parse(localStorage.getItem('rx_db')) || [];
            const list = document.getElementById('daftarBooking');
            list.innerHTML = bookings.map((item, idx) => `
                <tr class="align-middle">
                    <td><div class="fw-bold">${item.nama.toUpperCase()}</div></td>
                    <td class="text-primary fw-bold">${item.ruangan}</td>
                    <td><div class="fw-bold" style="font-size:0.75rem">${item.jamMulai} - ${item.jamSelesai}</div></td>
                    <td><span class="badge-it status-${item.status.toLowerCase()}">${item.status}</span></td>
                    <td class="text-end">
                        ${item.status === 'PENDING' ? `
                            <button class="btn btn-sm btn-outline-success" onclick="update(${idx}, 'APPROVED')"><i class="fas fa-check"></i></button>
                        ` : `<button class="btn btn-sm btn-outline-secondary" onclick="hapus(${idx})"><i class="fas fa-trash"></i></button>`}
                    </td>
                </tr>
            `).join('');
            document.getElementById('statPending').innerText = bookings.filter(b => b.status === 'PENDING').length;
            document.getElementById('statApproved').innerText = bookings.filter(b => b.status === 'APPROVED').length;
        }

        function update(idx, status) {
            let bookings = JSON.parse(localStorage.getItem('rx_db'));
            bookings[idx].status = status;
            localStorage.setItem('rx_db', JSON.stringify(bookings));
            tampilkanData();
        }

        function hapus(idx) {
            let bookings = JSON.parse(localStorage.getItem('rx_db'));
            bookings.splice(idx, 1);
            localStorage.setItem('rx_db', JSON.stringify(bookings));
            tampilkanData();
        }
    </script>
</body>
</html>
