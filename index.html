<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI | IT OPS - GITHUB VERSION V7.7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --neon-blue: #00f2ff; --bg-deep: #020617; --card-glass: rgba(15, 23, 42, 0.8); }
        body { background: var(--bg-deep); color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; margin: 0; overflow-x: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; position: fixed; height: 100vh; background: #070b17; border-right: 1px solid rgba(0, 242, 255, 0.2); display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-header { padding: 2rem 1.5rem; }
        .nav-menu { flex-grow: 1; padding: 0 15px; }
        .nav-link { color: #94a3b8 !important; padding: 14px 18px; margin-bottom: 5px; cursor: pointer; text-decoration: none; display: flex; align-items: center; border-radius: 12px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: rgba(0, 242, 255, 0.1); color: var(--neon-blue) !important; }

        /* FOOTER LOGOUT */
        .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-terminate { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ef4444; color: #ef4444; background: transparent; font-weight: 800; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-terminate:hover { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* CONTENT */
        .main-content { margin-left: 280px; padding: 3rem; }
        .glass-card { background: var(--card-glass); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 24px; padding: 2rem; backdrop-filter: blur(10px); }

        /* MODAL FIX */
        .modal-content { background: #0f172a !important; border: 1px solid var(--neon-blue) !important; border-radius: 20px; color: white !important; }
        .modal input, .modal textarea { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; padding: 12px; }
        .modal input::placeholder { color: #64748b; }
        
        .st-pill { padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        
        /* TV OVERLAY */
        #tvOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #020617; z-index: 9999; padding: 50px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="tvOverlay">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 style="font-family:'Orbitron'; color:white;">SBI <span class="text-info">MONITOR</span></h1>
            <button onclick="toggleTV(false)" class="btn btn-outline-danger px-4">EXIT TV MODE</button>
        </div>
        <div class="row">
            <div class="col-md-7"><h3 class="text-secondary mb-4">IN USE</h3><div id="tvInUse"></div></div>
            <div class="col-md-5"><h3 class="text-secondary mb-4">AVAILABLE</h3><div id="tvAvail"></div></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3 style="font-family:'Orbitron'; color:white; margin:0;">SBI <span class="text-info">HUB</span></h3>
            <small class="text-muted">IT OPS TERMINAL</small>
        </div>
        <div class="nav-menu">
            <div class="nav-link active" onclick="location.reload()"><i class="fas fa-th-large me-3"></i> Dashboard</div>
            <div class="nav-link" onclick="showRoomManager()"><i class="fas fa-database me-3"></i> Master Nodes</div>
            <div class="nav-link" onclick="toggleTV(true)"><i class="fas fa-tv me-3"></i> TV Display</div>
        </div>
        <div class="sidebar-footer">
            <button class="btn-terminate" onclick="handleLogout()"><i class="fas fa-power-off me-2"></i> TERMINATE</button>
        </div>
    </div>

    <div class="main-content">
        <div class="row mb-5 align-items-center">
            <div class="col">
                <h1 class="fw-bold" style="font-size: 2.5rem;">RESOURCE <span class="text-info">TRAFFIC</span></h1>
                <p class="text-secondary m-0">GitHub Pages Stable Environment v7.7</p>
            </div>
            <div class="col-auto">
                <div class="p-3 bg-dark border border-info rounded-4 text-center" style="min-width: 140px;">
                    <small class="text-info d-block">ACTIVE NODE</small>
                    <h2 class="m-0 fw-bold" id="statApproved">0</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4">
                <div class="glass-card">
                    <h5 class="text-info mb-4 fw-bold">QUICK DEPLOY</h5>
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="small text-secondary mb-1">Requester</label>
                            <input type="text" id="nama" class="form-control bg-dark border-secondary text-white" placeholder="Nama/Dept" required>
                        </div>
                        <div class="mb-3">
                            <label class="small text-secondary mb-1">Target Room</label>
                            <select id="ruangan" class="form-select bg-dark border-secondary text-white" onchange="updateRoomInfo()"></select>
                        </div>
                        <div id="roomDetail" class="small mb-4 p-3 rounded-3 bg-black border border-secondary text-info"></div>
                        <button type="submit" class="btn btn-info w-100 py-3 fw-bold text-dark" style="background: var(--neon-blue); border:none; border-radius:12px;">EXECUTE DEPLOYMENT</button>
                    </form>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="glass-card">
                    <table class="table table-dark table-hover align-middle">
                        <thead><tr class="text-secondary border-secondary"><th>IDENTIFIER</th><th>ROOM</th><th>STATUS</th><th class="text-end">ACTION</th></tr></thead>
                        <tbody id="mainTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="roomManagerModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 style="font-family:'Orbitron';" class="text-info m-0">MASTER DATABASE</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-5">
                            <input type="hidden" id="editIndex" value="-1">
                            <label class="small text-secondary">Room Name</label>
                            <input type="text" id="newRoomName" class="form-control mb-2" placeholder="e.g. War Room">
                            <label class="small text-secondary">Capacity</label>
                            <input type="text" id="newRoomCap" class="form-control mb-2" placeholder="e.g. 12 Pax">
                            <label class="small text-secondary">Facilities</label>
                            <textarea id="newRoomFac" class="form-control mb-3" rows="3" placeholder="Facilities..."></textarea>
                            <button onclick="saveRoom()" class="btn btn-info w-100 py-2 fw-bold text-dark">SAVE TO DATABASE</button>
                        </div>
                        <div class="col-md-7 border-start border-secondary">
                            <div id="roomListContainer" style="max-height: 300px; overflow-y: auto;" class="ps-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let rooms = JSON.parse(localStorage.getItem('sbi_rooms')) || [{nama:"WAR ROOM", cap:"12 Pax", fac:"Fiber, AC"}];
        let bookings = JSON.parse(localStorage.getItem('sbi_bookings')) || [];

        // LOGOUT TANPA PHP (GITHUB FRIENDLY)
        function handleLogout() {
            if(confirm("Terminate Session?")) {
                localStorage.removeItem('isLoggedIn'); // Hapus session buatan
                window.location.href = "login.html"; // Balik ke halaman login HTML kamu
            }
        }

        // TV OVERLAY TOGGLE
        function toggleTV(show) {
            const overlay = document.getElementById('tvOverlay');
            overlay.style.display = show ? 'block' : 'none';
            if(show) {
                const active = bookings;
                const occupiedNames = active.map(b => b.ruangan);
                const avail = rooms.filter(r => !occupiedNames.includes(r.nama));

                document.getElementById('tvInUse').innerHTML = active.map(b => `
                    <div style="background:#0f172a; border-left:10px solid #00f2ff; padding:20px; border-radius:15px; margin-bottom:15px;">
                        <h2 class="text-info">${b.ruangan}</h2><h4>USER: ${b.nama}</h4>
                    </div>
                `).join('') || '<p class="text-muted">No active sessions</p>';

                document.getElementById('tvAvail').innerHTML = avail.map(r => `
                    <div style="background:rgba(255,255,255,0.05); border:1px dashed #334155; padding:20px; border-radius:15px; margin-bottom:10px;">
                        <h5 class="m-0">${r.nama}</h5><small class="text-success">READY</small>
                    </div>
                `).join('');
            }
        }

        function showRoomManager() { renderRoomList(); new bootstrap.Modal(document.getElementById('roomManagerModal')).show(); }

        function saveRoom() {
            const name = document.getElementById('newRoomName').value;
            if(!name) return;
            const data = { nama: name.toUpperCase(), cap: document.getElementById('newRoomCap').value, fac: document.getElementById('newRoomFac').value };
            rooms.push(data);
            localStorage.setItem('sbi_rooms', JSON.stringify(rooms));
            document.getElementById('newRoomName').value = "";
            renderRoomList(); refreshAll();
        }

        function renderRoomList() {
            document.getElementById('roomListContainer').innerHTML = rooms.map((r, i) => `
                <div class="p-3 mb-2 bg-black rounded border border-secondary d-flex justify-content-between align-items-center">
                    <span>${r.nama}</span>
                    <button class="btn btn-sm btn-outline-danger" onclick="rooms.splice(${i},1);localStorage.setItem('sbi_rooms',JSON.stringify(rooms));renderRoomList();refreshAll();"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function refreshAll() {
            document.getElementById('ruangan').innerHTML = rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            document.getElementById('mainTable').innerHTML = bookings.map(b => `
                <tr class="border-secondary">
                    <td><b class="text-white">${b.nama}</b></td>
                    <td class="text-info fw-bold">${b.ruangan}</td>
                    <td><span class="st-pill bg-success text-dark">APPROVED</span></td>
                    <td class="text-end"><button class="btn btn-sm btn-outline-secondary" onclick="bookings=bookings.filter(x=>x.id!==${b.id});localStorage.setItem('sbi_bookings',JSON.stringify(bookings));refreshAll();"><i class="fas fa-trash text-danger"></i></button></td>
                </tr>
            `).join('');
            document.getElementById('statApproved').innerText = bookings.length;
            updateRoomInfo();
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            bookings.unshift({ id: Date.now(), nama: document.getElementById('nama').value.toUpperCase(), ruangan: document.getElementById('ruangan').value });
            localStorage.setItem('sbi_bookings', JSON.stringify(bookings));
            this.reset(); refreshAll();
        });

        function updateRoomInfo() {
            const r = rooms.find(x => x.nama === document.getElementById('ruangan').value);
            document.getElementById('roomDetail').innerHTML = r ? `<i class="fas fa-info-circle me-2"></i> ${r.cap} | ${r.fac}` : "Select node...";
        }

        refreshAll();
    </script>
</body>
</html>
