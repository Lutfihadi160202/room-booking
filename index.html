<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI | IT OPS - SMART MONITORING V7.9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --neon-blue: #00f2ff; 
            --neon-purple: #7000ff;
            --bg-deep: #020617; 
            --card-glass: rgba(15, 23, 42, 0.8);
            --border-glow: rgba(0, 242, 255, 0.3);
        }

        body { 
            background: var(--bg-deep); 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.1) 0%, transparent 40%);
        }

        /* SIDEBAR PRO DESIGN */
        .sidebar { 
            width: 280px; position: fixed; height: 100vh; 
            background: rgba(7, 11, 23, 0.98); 
            border-right: 1px solid var(--border-glow); 
            display: flex; flex-direction: column; z-index: 1000;
            backdrop-filter: blur(15px);
        }
        .sidebar-header { padding: 3rem 1.5rem; }
        .logo-text { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        
        .nav-menu { flex-grow: 1; padding: 0 15px; }
        .nav-link { 
            color: #94a3b8 !important; border-radius: 16px; padding: 16px 20px; 
            margin-bottom: 8px; cursor: pointer; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            text-decoration: none; display: flex; align-items: center; font-weight: 600;
        }
        .nav-link:hover, .nav-link.active { 
            background: linear-gradient(90deg, rgba(0, 242, 255, 0.15) 0%, transparent 100%); 
            color: var(--neon-blue) !important; 
            transform: translateX(5px);
        }

        .sidebar-footer { padding: 25px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-terminate { 
            width: 100%; padding: 14px; border-radius: 14px; 
            border: 2px solid #ef4444; color: #ef4444; background: transparent; 
            font-weight: 800; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-terminate:hover { background: #ef4444; color: white; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

        /* MAIN CONTENT & CARDS */
        .main-content { margin-left: 280px; padding: 3.5rem; }
        .glass-card { 
            background: var(--card-glass); border: 1px solid var(--border-glow); 
            border-radius: 30px; padding: 2.5rem; backdrop-filter: blur(12px); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); margin-bottom: 2rem;
        }

        /* MODAL FIX (TEKS PUTIH & CLICKABLE) */
        .modal { z-index: 2000 !important; }
        .modal-backdrop { z-index: 1900 !important; }
        .modal-content { 
            background: #0f172a !important; border: 1px solid var(--neon-blue) !important; 
            border-radius: 30px; color: white !important; box-shadow: 0 0 40px rgba(0, 242, 255, 0.2); 
        }
        .modal input, .modal textarea, .modal select { 
            background: #1e293b !important; border: 1px solid #334155 !important; 
            color: #ffffff !important; padding: 14px !important; border-radius: 12px !important;
        }
        .modal input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }
        
        /* TABLE STYLING */
        .table { color: #f8fafc !important; vertical-align: middle; }
        .table thead th { border-bottom: 1px solid #334155; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; color: #64748b; }
        .st-pill { padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; }

        .btn-action { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; transition: 0.3s; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3 class="logo-text m-0">SBI <span class="text-info">HUB</span></h3>
            <p class="text-muted small m-0 mt-1">IT OPERATIONS CENTER</p>
        </div>
        
        <div class="nav-menu">
            <div class="nav-link active" onclick="location.reload()"><i class="fas fa-th-large me-3"></i> Dashboard</div>
            <div class="nav-link" onclick="openRoomManager()"><i class="fas fa-database me-3"></i> Master Nodes</div>
            <div class="nav-link" onclick="window.open('tv.html', '_blank')"><i class="fas fa-desktop me-3"></i> TV Monitor</div>
        </div>

        <div class="sidebar-footer">
            <button class="btn-terminate" onclick="handleLogout()"><i class="fas fa-power-off me-2"></i> TERMINATE</button>
        </div>
    </div>

    <div class="main-content">
        <div class="row align-items-center mb-5">
            <div class="col">
                <h1 class="fw-black m-0" style="font-size: 2.8rem; font-family: 'Plus Jakarta Sans'; font-weight: 800;">SBI <span class="text-info">TRAFFIC</span></h1>
                <p class="text-secondary fw-semibold">Security & Infrastructure Monitoring v7.9</p>
            </div>
            <div class="col-auto">
                <div class="p-3 bg-dark border border-info rounded-4 text-center" style="min-width: 180px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);">
                    <small class="text-info d-block fw-bold small mb-1">ACTIVE SESSIONS</small>
                    <h2 class="m-0 fw-bold text-white" id="statApproved">0</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-xl-4">
                <div class="glass-card">
                    <h5 class="text-info mb-4 fw-bold"><i class="fas fa-plus-circle me-2"></i>NEW DEPLOYMENT</h5>
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="small text-secondary fw-bold mb-2">IDENTIFIER / USER</label>
                            <input type="text" id="nama" class="form-control bg-dark border-secondary text-white py-2" placeholder="Input ID..." required>
                        </div>
                        <div class="mb-3">
                            <label class="small text-secondary fw-bold mb-2">TARGET NODE</label>
                            <select id="ruangan" class="form-select bg-dark border-secondary text-white py-2" onchange="updateRoomInfo()"></select>
                        </div>
                        <div id="roomDetail" class="small mb-4 p-3 rounded-4 bg-black border border-secondary text-info fw-semibold"></div>
                        <button type="submit" class="btn btn-info w-100 py-3 fw-bold text-dark" style="border-radius:15px; background: linear-gradient(45deg, #00f2ff, #00d4ff); border:none;">EXECUTE COMMAND</button>
                    </form>
                </div>
            </div>

            <div class="col-xl-8">
                <div class="glass-card">
                    <h5 class="text-secondary mb-4 fw-bold"><i class="fas fa-list me-2"></i>ACTIVITY LOG</h5>
                    <table class="table">
                        <thead><tr><th>IDENTIFIER</th><th>ROOM NODE</th><th>STATUS</th><th class="text-end">ACTION</th></tr></thead>
                        <tbody id="mainTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="roomManagerModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="logo-text text-info m-0">DATABASE MASTER</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-5 border-end border-secondary pe-4">
                            <div class="mb-3">
                                <label class="small text-secondary mb-1">Room Designation</label>
                                <input type="text" id="newRoomName" class="form-control" placeholder="Room Name">
                            </div>
                            <div class="mb-3">
                                <label class="small text-secondary mb-1">Max Capacity</label>
                                <input type="text" id="newRoomCap" class="form-control" placeholder="Capacity">
                            </div>
                            <div class="mb-4">
                                <label class="small text-secondary mb-1">Infrastructure Assets</label>
                                <textarea id="newRoomFac" class="form-control" rows="3" placeholder="Facilities..."></textarea>
                            </div>
                            <button onclick="saveRoom()" class="btn btn-info w-100 py-3 text-dark fw-bold" style="border-radius:12px;">SAVE TO DATABASE</button>
                        </div>
                        <div class="col-md-7 ps-4">
                            <p class="text-info small fw-bold mb-3">REGISTERED NODES</p>
                            <div id="roomListContainer" style="max-height: 320px; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let rooms = JSON.parse(localStorage.getItem('sbi_v7_rooms')) || [{nama:"WAR ROOM", cap:"12 Pax", fac:"Fiber, AC"}];
        let bookings = JSON.parse(localStorage.getItem('sbi_v7_bookings')) || [];

        // Balik ke Login Barcode
        function handleLogout() {
            if(confirm("Terminate Session?")) window.location.href = "login.html";
        }

        function openRoomManager() { 
            renderRoomList(); 
            new bootstrap.Modal(document.getElementById('roomManagerModal')).show(); 
        }

        function saveRoom() {
            const name = document.getElementById('newRoomName').value;
            if(!name) return;
            rooms.push({ nama: name.toUpperCase(), cap: document.getElementById('newRoomCap').value, fac: document.getElementById('newRoomFac').value });
            localStorage.setItem('sbi_v7_rooms', JSON.stringify(rooms));
            document.getElementById('newRoomName').value = "";
            renderRoomList(); refreshAll();
        }

        function renderRoomList() {
            document.getElementById('roomListContainer').innerHTML = rooms.map((r, i) => `
                <div class="p-3 mb-2 bg-black rounded-4 border border-secondary d-flex justify-content-between align-items-center">
                    <div><b class="text-info">${r.nama}</b><br><small class="text-muted">${r.cap}</small></div>
                    <button class="btn btn-sm btn-outline-danger border-0" onclick="rooms.splice(${i},1);localStorage.setItem('sbi_v7_rooms',JSON.stringify(rooms));renderRoomList();refreshAll();"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function refreshAll() {
            document.getElementById('ruangan').innerHTML = rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            document.getElementById('mainTable').innerHTML = bookings.map(b => `
                <tr class="border-secondary">
                    <td><b class="text-white">${b.nama}</b></td>
                    <td class="text-info fw-bold">${b.ruangan}</td>
                    <td><span class="st-pill bg-success text-dark">APPROVED</span></td>
                    <td class="text-end">
                        <button class="btn-action btn-outline-danger border-1" onclick="bookings=bookings.filter(x=>x.id!==${b.id});localStorage.setItem('sbi_v7_bookings',JSON.stringify(bookings));refreshAll();"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('statApproved').innerText = bookings.length;
            updateRoomInfo();
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            bookings.unshift({ id: Date.now(), nama: document.getElementById('nama').value.toUpperCase(), ruangan: document.getElementById('ruangan').value });
            localStorage.setItem('sbi_v7_bookings', JSON.stringify(bookings));
            this.reset(); refreshAll();
        });

        function updateRoomInfo() {
            const r = rooms.find(x => x.nama === document.getElementById('ruangan').value);
            document.getElementById('roomDetail').innerHTML = r ? `<i class="fas fa-info-circle me-2"></i> ${r.cap} | ${r.fac}` : "Select node...";
        }

        refreshAll();
    </script>
</body>
</html>
