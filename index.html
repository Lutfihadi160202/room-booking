<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI | IT OPS - SMART MONITORING V7.3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --neon-blue: #00f2ff; 
            --bg-deep: #020617; 
            --card-glass: rgba(15, 23, 42, 0.8);
            --border-glow: rgba(0, 242, 255, 0.3);
        }

        body { 
            background: var(--bg-deep); 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.1) 0%, transparent 40%);
        }

        /* SIDEBAR & CONTENT */
        .sidebar { width: 280px; position: fixed; height: 100vh; background: rgba(7, 11, 23, 0.95); border-right: 1px solid var(--border-glow); backdrop-filter: blur(10px); z-index: 100; }
        .logo-text { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; font-weight: 700; }
        .nav-link { color: #94a3b8 !important; border-radius: 12px; padding: 14px 18px; margin: 5px 15px; cursor: pointer; transition: 0.3s; text-decoration: none; display: flex; align-items: center; }
        .nav-link:hover, .nav-link.active { background: rgba(0, 242, 255, 0.1); color: var(--neon-blue) !important; }
        .main-content { margin-left: 280px; padding: 3rem; }

        /* MODAL FIX (PENTING) */
        .modal-backdrop { z-index: 1040 !important; }
        .modal { z-index: 1050 !important; }
        .modal-content { background: #111827 !important; border: 1px solid var(--neon-blue) !important; border-radius: 25px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); }
        
        /* FIX TULISAN GELAP DI MODAL */
        .modal input, .modal textarea, .modal select { 
            background: #1f2937 !important; 
            border: 1px solid #374151 !important; 
            color: #ffffff !important; 
            padding: 12px !important;
        }
        .modal input::placeholder { color: #6b7280 !important; }

        /* TV DISPLAY */
        #tvDisplay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #020617; z-index: 9999; padding: 50px; overflow-y: auto; }
        .tv-card-active { background: #0f172a; border-left: 10px solid var(--neon-blue); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0, 242, 255, 0.1); }
        .tv-card-empty { background: rgba(255,255,255,0.03); border: 1px dashed #334155; border-radius: 15px; padding: 20px; margin-bottom: 15px; }

        /* OTHER COMPONENTS */
        .glass-card { background: var(--card-glass); border: 1px solid var(--border-glow); border-radius: 24px; padding: 2rem; backdrop-filter: blur(12px); margin-bottom: 2rem; }
        .btn-info { background: var(--neon-blue); border: none; color: #000; font-weight: 800; }
        .st-pill { padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    </style>
</head>
<body>

    <div id="tvDisplay">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="logo-text text-white">SBI <span class="text-info">LIVE MONITOR</span></h1>
            <button onclick="toggleTV()" class="btn btn-outline-danger">CLOSE TV MODE</button>
        </div>
        <div class="row">
            <div class="col-md-7"><h5 class="text-secondary mb-4">IN USE / RESERVED</h5><div id="tvContentActive"></div></div>
            <div class="col-md-5"><h5 class="text-secondary mb-4">AVAILABLE NOW</h5><div id="tvContentEmpty"></div></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="p-4 mb-4">
            <h3 class="logo-text text-white">SBI <span class="text-info">HUB</span></h3>
        </div>
        <div class="nav-link active" onclick="location.reload()"><i class="fas fa-th-large me-3"></i> Dashboard</div>
        <div class="nav-link" onclick="showRoomManager()"><i class="fas fa-database me-3"></i> Master Nodes</div>
        <div class="nav-link" onclick="toggleTV()"><i class="fas fa-tv me-3"></i> TV Display</div>
    </div>

    <div class="main-content">
        <div class="row align-items-center mb-5">
            <div class="col">
                <h1 class="fw-black m-0" style="font-size: 2.5rem;">RESOURCE <span class="text-info">TRAFFIC</span></h1>
                <p class="text-secondary">Infrastructure Terminal Control v7.3</p>
            </div>
            <div class="col-auto">
                <div class="p-3 bg-dark border border-info rounded-4 text-center">
                    <small class="text-info d-block">ACTIVE NODE</small>
                    <h2 class="m-0 fw-bold" id="statApproved">0</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4">
                <div class="glass-card">
                    <form id="bookingForm">
                        <label class="small mb-1 text-info">Requestor</label>
                        <input type="text" id="nama" class="form-control mb-3" placeholder="Nama/Dept" required>
                        <label class="small mb-1 text-info">Select Room</label>
                        <select id="ruangan" class="form-select mb-3" onchange="updateRoomInfo()"></select>
                        <div id="roomDetail" class="small mb-4 p-3 rounded-4 bg-black text-info border border-secondary"></div>
                        <div class="row g-2 mb-4">
                            <div class="col-6"><label class="small">Start</label><input type="datetime-local" id="tglMulai" class="form-control" required></div>
                            <div class="col-6"><label class="small">End</label><input type="datetime-local" id="tglSelesai" class="form-control" required></div>
                        </div>
                        <button type="submit" class="btn btn-info w-100 py-3">SUBMIT DEPLOYMENT</button>
                    </form>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="glass-card">
                    <table class="table table-dark table-hover">
                        <thead><tr class="text-secondary"><th>IDENTIFIER</th><th>ROOM</th><th>STATUS</th><th class="text-end">ACTION</th></tr></thead>
                        <tbody id="mainTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="roomManagerModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="logo-text text-info m-0">MASTER DATABASE</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-5">
                            <input type="hidden" id="editIndex" value="-1">
                            <div class="mb-2">
                                <label class="small text-secondary">Room Name</label>
                                <input type="text" id="newRoomName" class="form-control" placeholder="e.g. War Room">
                            </div>
                            <div class="mb-2">
                                <label class="small text-secondary">Capacity</label>
                                <input type="text" id="newRoomCap" class="form-control" placeholder="e.g. 12 Pax">
                            </div>
                            <div class="mb-3">
                                <label class="small text-secondary">Facilities</label>
                                <textarea id="newRoomFac" class="form-control" rows="3" placeholder="e.g. AC, Wifi"></textarea>
                            </div>
                            <button type="button" onclick="saveRoom()" class="btn btn-info w-100 py-2">SAVE TO DB</button>
                        </div>
                        <div class="col-md-7">
                            <label class="small text-secondary mb-2">Active Nodes</label>
                            <div id="roomListContainer" style="max-height: 350px; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Pakai database yang sama agar data tidak hilang
        let rooms = JSON.parse(localStorage.getItem('sbi_v72_rooms')) || [
            { nama: "WAR ROOM", cap: "12 Pax", fac: "Fiber, AC, TV" },
            { nama: "SERVER ROOM A", cap: "Restricted", fac: "Biometric" }
        ];
        let bookings = JSON.parse(localStorage.getItem('sbi_v72_bookings')) || [];

        function toggleTV() {
            const tv = document.getElementById('tvDisplay');
            tv.style.display = tv.style.display === 'block' ? 'none' : 'block';
            renderTV();
        }

        function renderTV() {
            const active = bookings.filter(b => b.status === 'APPROVED');
            const occupied = active.map(b => b.ruangan);
            
            document.getElementById('tvContentActive').innerHTML = active.length > 0 ? 
                active.map(b => `<div class="tv-card-active"><h2 class="text-info m-0">${b.ruangan}</h2><h4 class="text-white">USER: ${b.nama}</h4><small>${b.waktu}</small></div>`).join('') : '<p class="text-muted">No active sessions</p>';

            const available = rooms.filter(r => !occupied.includes(r.nama));
            document.getElementById('tvContentEmpty').innerHTML = available.map(r => `<div class="tv-card-empty"><h5 class="text-white m-0">${r.nama}</h5><small class="text-success">READY TO USE</small></div>`).join('');
        }

        function showRoomManager() { 
            renderRoomList(); 
            const myModal = new bootstrap.Modal(document.getElementById('roomManagerModal'));
            myModal.show(); 
        }

        function saveRoom() {
            const name = document.getElementById('newRoomName').value;
            if(!name) return alert("Isi nama ruangan!");
            
            const data = { 
                nama: name.toUpperCase(), 
                cap: document.getElementById('newRoomCap').value || "-", 
                fac: document.getElementById('newRoomFac').value || "-" 
            };
            
            const editIdx = parseInt(document.getElementById('editIndex').value);
            if(editIdx === -1) rooms.push(data); else rooms[editIdx] = data;
            
            localStorage.setItem('sbi_v72_rooms', JSON.stringify(rooms));
            document.getElementById('newRoomName').value = "";
            document.getElementById('newRoomCap').value = "";
            document.getElementById('newRoomFac').value = "";
            document.getElementById('editIndex').value = "-1";
            
            renderRoomList();
            refreshAll();
        }

        function editRoom(i) {
            const r = rooms[i];
            document.getElementById('newRoomName').value = r.nama;
            document.getElementById('newRoomCap').value = r.cap;
            document.getElementById('newRoomFac').value = r.fac;
            document.getElementById('editIndex').value = i;
        }

        function deleteRoom(i) {
            if(confirm("Hapus ruangan ini?")) {
                rooms.splice(i, 1);
                localStorage.setItem('sbi_v72_rooms', JSON.stringify(rooms));
                renderRoomList();
                refreshAll();
            }
        }

        function renderRoomList() {
            document.getElementById('roomListContainer').innerHTML = rooms.map((r, i) => `
                <div class="p-3 mb-2 bg-black rounded border border-secondary d-flex justify-content-between align-items-center">
                    <div><b class="text-info">${r.nama}</b><br><small class="text-secondary">${r.cap}</small></div>
                    <div>
                        <button class="btn btn-sm btn-outline-info me-1" onclick="editRoom(${i})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteRoom(${i})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function setStatus(id, s) {
            const i = bookings.findIndex(b => b.id === id);
            if(i !== -1) { bookings[i].status = s; localStorage.setItem('sbi_v72_bookings', JSON.stringify(bookings)); refreshAll(); }
        }

        function deleteBooking(id) {
            bookings = bookings.filter(b => b.id !== id);
            localStorage.setItem('sbi_v72_bookings', JSON.stringify(bookings));
            refreshAll();
        }

        function refreshAll() {
            document.getElementById('ruangan').innerHTML = rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            document.getElementById('mainTable').innerHTML = bookings.map(b => `
                <tr>
                    <td><b class="text-white">${b.nama}</b><br><small class="text-secondary">${b.waktu}</small></td>
                    <td><span class="text-info fw-bold">${b.ruangan}</span></td>
                    <td><span class="st-pill bg-${b.status === 'APPROVED' ? 'success' : (b.status === 'PENDING' ? 'warning text-dark' : 'danger')}">${b.status}</span></td>
                    <td class="text-end">
                        ${b.status === 'PENDING' ? `
                            <button class="btn btn-sm btn-success" onclick="setStatus(${b.id}, 'APPROVED')"><i class="fas fa-check"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="setStatus(${b.id}, 'REJECTED')"><i class="fas fa-times"></i></button>
                        ` : `<button class="btn btn-sm btn-secondary" onclick="deleteBooking(${b.id})"><i class="fas fa-trash"></i></button>`}
                    </td>
                </tr>
            `).join('');
            document.getElementById('statApproved').innerText = bookings.filter(b => b.status === 'APPROVED').length;
            updateRoomInfo();
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = { id: Date.now(), nama: document.getElementById('nama').value.toUpperCase(), ruangan: document.getElementById('ruangan').value, waktu: document.getElementById('tglMulai').value.replace('T', ' '), status: "PENDING" };
            bookings.unshift(data); localStorage.setItem('sbi_v72_bookings', JSON.stringify(bookings)); refreshAll(); this.reset();
        });

        function updateRoomInfo() {
            const r = rooms.find(x => x.nama === document.getElementById('ruangan').value);
            document.getElementById('roomDetail').innerHTML = r ? `CAP: ${r.cap} | FAC: ${r.fac}` : "Select node...";
        }

        refreshAll();
    </script>
</body>
</html>
