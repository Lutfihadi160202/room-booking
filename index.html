<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI | IT OPS - SMART MONITORING V7.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --neon-blue: #00f2ff; 
            --neon-purple: #7000ff; 
            --bg-deep: #020617; 
            --card-glass: rgba(15, 23, 42, 0.8);
            --border-glow: rgba(0, 242, 255, 0.3);
            --text-bright: #f8fafc;
        }

        body { 
            background: var(--bg-deep); 
            color: var(--text-bright); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%);
        }

        /* SIDEBAR */
        .sidebar { width: 280px; position: fixed; height: 100vh; background: rgba(7, 11, 23, 0.95); border-right: 1px solid var(--border-glow); backdrop-filter: blur(10px); z-index: 1000; }
        .sidebar-header { padding: 2.5rem 1.5rem; }
        .logo-text { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; font-weight: 700; }
        .nav-link { color: #94a3b8 !important; border-radius: 12px; padding: 14px 18px; margin: 5px 15px; transition: 0.3s; display: flex; align-items: center; text-decoration: none; font-weight: 600; cursor: pointer; }
        .nav-link:hover, .nav-link.active { background: rgba(0, 242, 255, 0.1); color: var(--neon-blue) !important; box-shadow: inset 4px 0 0 var(--neon-blue); }

        /* MAIN CONTENT */
        .main-content { margin-left: 280px; padding: 3rem; }
        .glass-card { background: var(--card-glass); border: 1px solid var(--border-glow); border-radius: 24px; padding: 2rem; backdrop-filter: blur(12px); margin-bottom: 2rem; }

        /* TV DISPLAY MODE */
        #tvDisplay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); z-index: 9999; padding: 50px; overflow-y: auto;
        }
        .tv-section-title { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: #64748b; letter-spacing: 3px; border-bottom: 2px solid #1e293b; padding-bottom: 10px; margin-bottom: 30px; }
        
        /* Card Terpakai */
        .tv-card-active { background: linear-gradient(135deg, #1e1b4b, #0f172a); border-left: 15px solid var(--neon-blue); border-radius: 20px; padding: 30px; margin-bottom: 25px; box-shadow: 0 10px 40px rgba(0, 242, 255, 0.15); animation: pulse-blue 2s infinite; }
        
        /* Card Kosong */
        .tv-card-empty { background: rgba(255,255,255,0.02); border: 1px dashed #334155; border-radius: 20px; padding: 25px; margin-bottom: 25px; opacity: 0.7; }
        
        @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(0, 242, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); } }

        /* UTILS */
        .form-control, .form-select { background: rgba(30, 41, 59, 0.5) !important; border: 1px solid #334155 !important; color: #ffffff !important; border-radius: 14px; padding: 12px; }
        .table { color: var(--text-bright); }
        .st-pill { padding: 6px 14px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; border: 1px solid currentColor; }
        .st-approved { color: #00ff88; background: rgba(0, 255, 136, 0.1); }
        .st-pending { color: #ffcc00; background: rgba(255, 204, 0, 0.1); }
        .btn-action { width: 38px; height: 38px; border-radius: 10px; border: none; color: white; margin-left: 6px; }
    </style>
</head>
<body>

    <div id="tvDisplay">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h1 class="logo-text text-white m-0" style="font-size: 3rem;">SBI <span class="text-info">LIVE MONITOR</span></h1>
                <p class="text-info fw-bold mb-0" id="tvTime"></p>
            </div>
            <button onclick="toggleTV()" class="btn btn-outline-danger btn-lg px-5" style="border-radius:15px;">CLOSE MONITOR</button>
        </div>

        <div class="row">
            <div class="col-lg-7">
                <div class="tv-section-title"><i class="fas fa- Fach-check-circle me-2 text-info"></i> IN USE / RESERVED</div>
                <div id="tvContentActive"></div>
            </div>

            <div class="col-lg-5">
                <div class="tv-section-title"><i class="fas fa-door-open me-2 text-success"></i> AVAILABLE NOW</div>
                <div id="tvContentEmpty"></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3 class="logo-text m-0 text-white">SBI <span class="text-info">HUB</span></h3>
            <p class="text-muted small m-0">IT OPERATIONS CENTER</p>
        </div>
        <div class="sidebar-menu">
            <div class="nav-link active"><i class="fas fa-th-large me-3"></i> Dashboard</div>
            <div class="nav-link" onclick="showRoomManager()"><i class="fas fa-server me-3"></i> Master Nodes</div>
            <div class="nav-link" onclick="toggleTV()" style="color: var(--neon-blue) !important; background: rgba(0,242,255,0.1);"><i class="fas fa-tv me-3"></i> TV Display Mode</div>
        </div>
        <div class="sidebar-footer">
            <button onclick="location.reload()" class="btn btn-outline-info w-100 py-2" style="border-radius:12px;"><i class="fas fa-sync-alt me-2"></i> REFRESH SYSTEM</button>
        </div>
    </div>

    <div class="main-content">
        <div class="row align-items-end mb-5">
            <div class="col-md-7">
                <h1 class="fw-black m-0" style="font-size: 2.5rem;">RESOURCE <span class="text-info">TRAFFIC</span></h1>
                <p class="text-secondary fw-600">Infrastructure Terminal Control v7.2</p>
            </div>
            <div class="col-md-5 d-flex justify-content-end gap-3">
                <div class="p-3 bg-dark border border-info rounded-4 text-center" style="min-width: 140px;">
                    <small class="text-info d-block">ACTIVE NODE</small>
                    <h2 class="m-0 fw-bold text-white" id="statApproved">0</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-xl-4">
                <div class="glass-card">
                    <span class="text-info fw-bold d-block mb-3">NEW DEPLOYMENT</span>
                    <form id="bookingForm">
                        <label class="small mb-1">Requestor</label>
                        <input type="text" id="nama" class="form-control mb-3" placeholder="Input User/Dept" required>
                        <label class="small mb-1">Target Room</label>
                        <select id="ruangan" class="form-select mb-2" onchange="updateRoomInfo()"></select>
                        <div id="roomDetail" class="small mb-4 p-3 rounded-4 bg-black border border-secondary text-info"></div>
                        <div class="row g-2 mb-4">
                            <div class="col-6"><label class="small">Start Cycle</label><input type="datetime-local" id="tglMulai" class="form-control" required></div>
                            <div class="col-6"><label class="small">End Cycle</label><input type="datetime-local" id="tglSelesai" class="form-control" required></div>
                        </div>
                        <button type="submit" class="btn btn-info w-100 fw-bold py-3 text-white" style="border-radius:14px; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); border:none;">SUBMIT DATA</button>
                    </form>
                </div>
            </div>
            <div class="col-xl-8">
                <div class="glass-card">
                    <span class="text-secondary fw-bold d-block mb-3">LIVE TRAFFIC MONITOR</span>
                    <table class="table align-middle">
                        <thead>
                            <tr class="text-secondary"><th>IDENTIFIER</th><th>ROOM</th><th>STATUS</th><th class="text-end">ACTION</th></tr>
                        </thead>
                        <tbody id="mainTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="roomManagerModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-info" style="border-radius: 25px;">
                <div class="modal-body p-5">
                    <h4 class="logo-text text-info mb-4">MASTER DATABASE</h4>
                    <div class="row g-4">
                        <div class="col-md-5">
                            <input type="hidden" id="editIndex" value="-1">
                            <input type="text" id="newRoomName" class="form-control mb-2" placeholder="Nama Ruangan">
                            <input type="text" id="newRoomCap" class="form-control mb-2" placeholder="Kapasitas">
                            <textarea id="newRoomFac" class="form-control mb-3" placeholder="Fasilitas..."></textarea>
                            <button onclick="saveRoom()" class="btn btn-info w-100 text-white fw-bold">SAVE TO DB</button>
                        </div>
                        <div class="col-md-7">
                            <div id="roomListContainer" style="max-height: 300px; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let rooms = JSON.parse(localStorage.getItem('sbi_v72_rooms')) || [
            { nama: "WAR ROOM", cap: "12 Pax", fac: "Fiber, AC, TV" },
            { nama: "SERVER ROOM A", cap: "Restricted", fac: "Biometric" }
        ];
        let bookings = JSON.parse(localStorage.getItem('sbi_v72_bookings')) || [];

        function toggleTV() {
            const tv = document.getElementById('tvDisplay');
            tv.style.display = tv.style.display === 'block' ? 'none' : 'block';
            renderTV();
        }

        function renderTV() {
            const now = new Date();
            document.getElementById('tvTime').innerText = now.toLocaleString();
            
            // 1. Ambil list ruangan yang sedang di-book (APPROVED)
            const activeBookings = bookings.filter(b => b.status === 'APPROVED');
            const occupiedRoomNames = activeBookings.map(b => b.ruangan);

            // 2. Render List Terpakai
            document.getElementById('tvContentActive').innerHTML = activeBookings.length > 0 ? 
                activeBookings.map(b => `
                    <div class="tv-card-active">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <h2 style="font-family:'Orbitron'; font-size:3rem; margin:0; color:var(--neon-blue);">${b.ruangan}</h2>
                                <h4 class="text-white mt-2">USER: ${b.nama}</h4>
                            </div>
                            <div class="col-4 text-end">
                                <span class="badge bg-danger p-3 px-4" style="font-size:1.2rem;">OCCUPIED</span>
                                <div class="text-info mt-3 fw-bold">${b.waktu}</div>
                            </div>
                        </div>
                    </div>
                `).join('') : '<h3 class="text-muted mt-4">NO ACTIVE RESERVATIONS</h3>';

            // 3. Render List Kosong
            const availableRooms = rooms.filter(r => !occupiedRoomNames.includes(r.nama));
            document.getElementById('tvContentEmpty').innerHTML = availableRooms.length > 0 ?
                availableRooms.map(r => `
                    <div class="tv-card-empty">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h3 class="text-white m-0" style="font-family:'Orbitron';">${r.nama}</h3>
                                <small class="text-secondary">${r.cap} | ${r.fac}</small>
                            </div>
                            <span class="text-success fw-bold"><i class="fas fa-check-circle"></i> READY</span>
                        </div>
                    </div>
                `).join('') : '<h3 class="text-muted mt-4">ALL ROOMS FULL</h3>';
        }

        // Timer Real-time di TV
        setInterval(() => { if(document.getElementById('tvDisplay').style.display === 'block') renderTV(); }, 10000);

        function showRoomManager() { renderRoomList(); new bootstrap.Modal(document.getElementById('roomManagerModal')).show(); }

        function saveRoom() {
            const name = document.getElementById('newRoomName').value;
            const editIdx = parseInt(document.getElementById('editIndex').value);
            if(!name) return;
            const data = { nama: name.toUpperCase(), cap: document.getElementById('newRoomCap').value, fac: document.getElementById('newRoomFac').value };
            if(editIdx === -1) rooms.push(data); else rooms[editIdx] = data;
            localStorage.setItem('sbi_v72_rooms', JSON.stringify(rooms));
            refreshAll();
        }

        function editRoom(i) {
            const r = rooms[i];
            document.getElementById('newRoomName').value = r.nama; document.getElementById('newRoomCap').value = r.cap;
            document.getElementById('newRoomFac').value = r.fac; document.getElementById('editIndex').value = i;
        }

        function deleteRoom(i) { rooms.splice(i, 1); localStorage.setItem('sbi_v72_rooms', JSON.stringify(rooms)); renderRoomList(); refreshAll(); }

        function renderRoomList() {
            document.getElementById('roomListContainer').innerHTML = rooms.map((r, i) => `
                <div class="p-3 mb-2 bg-black rounded border border-secondary d-flex justify-content-between">
                    <div><b class="text-info">${r.nama}</b><br><small class="text-secondary">${r.cap}</small></div>
                    <div>
                        <button class="btn btn-sm btn-info text-white" onclick="editRoom(${i})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deleteRoom(${i})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function setStatus(id, s) {
            const i = bookings.findIndex(b => b.id === id);
            if(i !== -1) { bookings[i].status = s; localStorage.setItem('sbi_v72_bookings', JSON.stringify(bookings)); refreshAll(); }
        }

        function deleteBooking(id) {
            bookings = bookings.filter(b => b.id !== id);
            localStorage.setItem('sbi_v72_bookings', JSON.stringify(bookings));
            refreshAll();
        }

        function refreshAll() {
            document.getElementById('ruangan').innerHTML = rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            document.getElementById('mainTable').innerHTML = bookings.map(b => `
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td><b class="text-white">${b.nama}</b><br><small class="text-secondary">${b.waktu}</small></td>
                    <td><span class="text-info fw-bold">${b.ruangan}</span></td>
                    <td><span class="st-pill st-${b.status.toLowerCase()}">${b.status}</span></td>
                    <td class="text-end">
                        ${b.status === 'PENDING' ? `
                            <button class="btn-action bg-success" onclick="setStatus(${b.id}, 'APPROVED')"><i class="fas fa-check"></i></button>
                            <button class="btn-action bg-danger" onclick="setStatus(${b.id}, 'REJECTED')"><i class="fas fa-times"></i></button>
                        ` : `<button class="btn-action bg-secondary" onclick="deleteBooking(${b.id})"><i class="fas fa-trash"></i></button>`}
                    </td>
                </tr>
            `).join('');
            document.getElementById('statApproved').innerText = bookings.filter(b => b.status === 'APPROVED').length;
            updateRoomInfo();
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = { id: Date.now(), nama: document.getElementById('nama').value.toUpperCase(), ruangan: document.getElementById('ruangan').value, waktu: document.getElementById('tglMulai').value.replace('T', ' '), status: "PENDING" };
            bookings.unshift(data); localStorage.setItem('sbi_v72_bookings', JSON.stringify(bookings)); refreshAll(); this.reset();
        });

        function updateRoomInfo() {
            const r = rooms.find(x => x.nama === document.getElementById('ruangan').value);
            document.getElementById('roomDetail').innerHTML = r ? `<i class="fas fa-info-circle me-2"></i> ${r.cap} | ${r.fac}` : "Select node...";
        }

        refreshAll();
    </script>
</body>
</html>
