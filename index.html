<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM.X | IT OPERATIONS HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #00f2ff; --secondary: #7000ff; --bg-deep: #020617; --card-bg: #0f172a; --border: #1e293b; --text-main: #f8fafc; }
        body { background: var(--bg-deep); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; margin: 0; }
        
        /* --- TAMPILAN HALAMAN LOGIN --- */
        #loginPage {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            position: fixed; width: 100%; z-index: 9999;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border);
            padding: 2.5rem; border-radius: 24px; width: 100%; max-width: 400px;
            backdrop-filter: blur(15px); box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
            text-align: center;
        }

        /* --- TAMPILAN HALAMAN DASHBOARD --- */
        #dashboardPage { display: none; } /* Tersembunyi sebelum login sukses */
        
        .sidebar { width: 280px; position: fixed; height: 100vh; background: #070b17; border-right: 1px solid var(--border); padding: 2rem; }
        .main-content { margin-left: 280px; padding: 2.5rem; }

        /* UI Card IT Style */
        .glass-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; position: relative; overflow: hidden; margin-bottom: 1.5rem; }
        .glass-card::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
        
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 5px; display: block; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; color: var(--primary); }

        .form-control, .form-select { background: #1e293b; border: 1px solid var(--border); color: white; border-radius: 10px; padding: 10px; }
        .form-control:focus { background: #1e293b; color: white; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.1); }
        
        .btn-it { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; font-weight: 700; border-radius: 10px; transition: 0.3s; padding: 12px; }
        .btn-it:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 242, 255, 0.4); color: white; }
        
        .table { color: var(--text-main); margin-bottom: 0; }
        .table thead th { border-bottom: 2px solid var(--border); color: #64748b; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .table tbody td { border-bottom: 1px solid var(--border); padding: 1rem 0.5rem; }

        .badge-it { padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; font-family: 'JetBrains Mono'; border: 1px solid currentColor; text-transform: uppercase; }
        .status-pending { color: #eab308; } .status-approved { color: #22c55e; } .status-rejected { color: #ef4444; }
        
        #qrcode img { border: 6px solid white; border-radius: 12px; margin: 15px auto; }
    </style>
</head>
<body>

    <div id="loginPage">
        <div class="login-card">
            <h2 style="font-family: 'JetBrains Mono'; color: var(--primary); font-weight: 800; margin-bottom: 5px;">OPS.CENTER</h2>
            <p class="text-muted small mb-4">RESTRICTED ACCESS AREA</p>
            
            <div class="mb-3 text-start">
                <label class="stat-label">System Username</label>
                <input type="text" id="userInput" class="form-control" placeholder="admin">
            </div>
            <div class="mb-4 text-start">
                <label class="stat-label">Security Password</label>
                <input type="password" id="passInput" class="form-control" placeholder="••••••••">
            </div>
            <button onclick="prosesLogin()" class="btn btn-it w-100">AUTHORIZE ACCESS</button>
        </div>
    </div>

    <div id="dashboardPage">
        <div class="sidebar d-flex flex-column">
            <div class="brand-logo fs-4 fw-bold text-info mb-5">RM.X / OPS</div>
            
            <div class="mb-auto text-center">
                <div class="glass-card p-3 shadow-lg">
                    <p class="stat-label mb-2">SCAN_USER_ACCESS</p>
                    <div id="qrcode" class="d-flex justify-content-center"></div>
                    <p class="text-muted mt-2" style="font-size: 0.6rem;">Scan to Open Booking Form</p>
                </div>
            </div>

            <button onclick="location.reload()" class="btn btn-outline-danger btn-sm w-100 mt-3">TERMINATE SESSION</button>
        </div>

        <div class="main-content">
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="glass-card">
                        <span class="stat-label">Pending Approval</span>
                        <div class="stat-value" id="statPending">00</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card">
                        <span class="stat-label">Approved Logs</span>
                        <div class="stat-value" id="statApproved" style="color: #22c55e">00</div>
                    </div>
                </div>
                <div class="col-md-4 text-end d-flex align-items-center justify-content-end">
                    <a href="display.html" target="_blank" class="btn btn-outline-info rounded-pill px-4">
                        <i class="fas fa-tv me-2"></i> MONITORING FEED
                    </a>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <div class="glass-card">
                        <h6 class="fw-bold mb-4 text-primary"><i class="fas fa-plus-circle me-2"></i>NEW_RESERVATION</h6>
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="stat-label">Requester Name</label>
                                <input type="text" id="nama" class="form-control" placeholder="Nama Lengkap..." required>
                            </div>
                            <div class="mb-3">
                                <label class="stat-label">Assign Room</label>
                                <select id="ruangan" class="form-select" required></select>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6"><label class="stat-label">Start Date</label><input type="date" id="tglMulai" class="form-control" required></div>
                                <div class="col-6"><label class="stat-label">End Date</label><input type="date" id="tglSelesai" class="form-control" required></div>
                            </div>
                            <div class="row g-2 mb-4">
                                <div class="col-6"><label class="stat-label">Start Time</label><input type="time" id="jamMulai" class="form-control" required></div>
                                <div class="col-6"><label class="stat-label">End Time</label><input type="time" id="jamSelesai" class="form-control" required></div>
                            </div>
                            <button type="submit" class="btn btn-it w-100">EXECUTE LOG</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="glass-card">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h6 class="fw-bold text-primary m-0"><i class="fas fa-server me-2"></i>TRAFFIC_LOGS</h6>
                            <div class="small opacity-50 fw-bold" style="font-size: 0.6rem;">STATUS: REALTIME</div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-dark table-hover">
                                <thead>
                                    <tr>
                                        <th>IDENTIFIER</th>
                                        <th>NODE_ROOM</th>
                                        <th>TIME_FRAME</th>
                                        <th>STATUS</th>
                                        <th class="text-end">OP</th>
                                    </tr>
                                </thead>
                                <tbody id="daftarBooking" style="font-size: 0.8rem;">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi API
        const scriptURL = 'https://script.google.com/macros/s/AKfycby9yG2ivGODdSAzLLS8fHJM9U82mf4sJRnjbtg7GL_AQbNyZSoT3OgNzckAdMQZ9Qa9/exec';
        
        let rooms = [
            { nama: "SERVER ROOM A" }, { nama: "WAR ROOM" }, { nama: "MEETING ROOM 1" }, { nama: "LAB NETWORKING" }
        ];

        // 1. Fungsi Login
        function prosesLogin() {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;
            
            if(u === "admin" && p === "admin123") {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('dashboardPage').style.display = 'block';
                mulaiAplikasi();
            } else {
                alert("ACCESS DENIED: Username atau Password Salah!");
            }
        }

        // 2. Fungsi Utama Dashboard
        function mulaiAplikasi() {
            updateRoomSelect();
            tampilkanData();
            // Generate QR Code otomatis
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href,
                width: 100, height: 100
            });
        }

        function updateRoomSelect() {
            const select = document.getElementById('ruangan');
            select.innerHTML = rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
        }

        // 3. Handle Submit Booking
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                nama: document.getElementById('nama').value,
                ruangan: document.getElementById('ruangan').value,
                tglMulai: document.getElementById('tglMulai').value,
                tglSelesai: document.getElementById('tglSelesai').value,
                jamMulai: document.getElementById('jamMulai').value,
                jamSelesai: document.getElementById('jamSelesai').value,
                status: "PENDING"
            };

            let bookings = JSON.parse(localStorage.getItem('it_ops_data')) || [];
            bookings.unshift(data); // Tambah ke atas
            localStorage.setItem('it_ops_data', JSON.stringify(bookings));
            
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            this.reset();
            tampilkanData();
        });

        // 4. Render Tabel Data
        function tampilkanData() {
            let bookings = JSON.parse(localStorage.getItem('it_ops_data')) || [];
            const list = document.getElementById('daftarBooking');
            
            list.innerHTML = bookings.length === 0 ? '<tr><td colspan="5" class="text-center opacity-25 py-4">NO_LOGS_AVAILABLE</td></tr>' : '';

            bookings.forEach((item, idx) => {
                list.innerHTML += `
                    <tr class="align-middle">
                        <td>
                            <div class="fw-bold">${item.nama.toUpperCase()}</div>
                            <code class="text-muted" style="font-size:0.6rem">ID_LOG:${idx+100}</code>
                        </td>
                        <td class="text-primary fw-bold">${item.ruangan}</td>
                        <td>
                            <div class="fw-bold" style="font-size:0.75rem">${item.jamMulai} - ${item.jamSelesai}</div>
                            <div class="small opacity-50">${item.tglMulai}</div>
                        </td>
                        <td><span class="badge-it status-${item.status.toLowerCase()}">${item.status}</span></td>
                        <td class="text-end">
                            ${item.status === 'PENDING' ? `
                                <button class="btn btn-sm btn-outline-success p-1" onclick="ubahStatus(${idx}, 'APPROVED')"><i class="fas fa-check"></i></button>
                                <button class="btn btn-sm btn-outline-danger p-1" onclick="ubahStatus(${idx}, 'REJECTED')"><i class="fas fa-times"></i></button>
                            ` : `<button class="btn btn-sm btn-outline-secondary p-1" onclick="hapusData(${idx})"><i class="fas fa-trash"></i></button>`}
                        </td>
                    </tr>
                `;
            });

            // Update Counter Statistik
            document.getElementById('statPending').innerText = bookings.filter(b => b.status === 'PENDING').length.toString().padStart(2, '0');
            document.getElementById('statApproved').innerText = bookings.filter(b => b.status === 'APPROVED').length.toString().padStart(2, '0');
        }

        function ubahStatus(idx, status) {
            let bookings = JSON.parse(localStorage.getItem('it_ops_data'));
            bookings[idx].status = status;
            localStorage.setItem('it_ops_data', JSON.stringify(bookings));
            tampilkanData();
        }

        function hapusData(idx) {
            if(confirm("TERMINATE THIS LOG?")) {
                let bookings = JSON.parse(localStorage.getItem('it_ops_data'));
                bookings.splice(idx, 1);
                localStorage.setItem('it_ops_data', JSON.stringify(bookings));
                tampilkanData();
            }
        }
    </script>
</body>
</html>
