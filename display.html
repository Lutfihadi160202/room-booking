<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV DISPLAY | OPS MONITORING</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --primary: #00f2ff;
            --bg-deep: #020617;
            --card-bg: rgba(15, 23, 42, 0.7);
            --border: #1e293b;
        }

        body { 
            background: var(--bg-deep); 
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 50%);
        }

        /* Header Monitoring */
        .tv-header {
            padding: 30px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
        }

        .system-title {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Card Room Styles */
        .room-node {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.5s ease;
            position: relative;
        }

        .room-node::before {
            content: "ACTIVE_SESSION";
            position: absolute;
            top: 15px;
            right: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--primary);
            opacity: 0.6;
        }

        .room-name {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .user-info {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .time-box {
            background: rgba(0, 242, 255, 0.05);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 12px;
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 800;
        }

        #clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
        }
    </style>
</head>
<body>

    <div class="tv-header d-flex justify-content-between align-items-center">
        <div>
            <div class="system-title fs-3">RESOURCE_MONITOR/v2.0</div>
            <div class="small opacity-50"><span class="live-indicator"></span>SYSTEM_STATUS: STABLE // SCANNING_RESERVATIONS...</div>
        </div>
        <div class="text-end">
            <div id="clock">00:00:00</div>
            <div class="small text-primary fw-bold" id="currentDate">LOADING_DATE...</div>
        </div>
    </div>

    <div class="container-fluid mt-5 px-5">
        <div id="tvDisplayGrid" class="row g-4">
            </div>
    </div>

    <script>
        function updateDisplay() {
            const bookings = JSON.parse(localStorage.getItem('rx_bookings_v4')) || [];
            const container = document.getElementById('tvDisplayGrid');
            
            // Hanya tampilkan yang APPROVED
            const active = bookings.filter(b => b.status === 'APPROVED');

            if (active.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center mt-5 animate__animated animate__pulse animate__infinite">
                        <i class="fas fa-satellite-dish mb-4" style="font-size: 5rem; color: #1e293b;"></i>
                        <h1 style="color: #1e293b; font-family: 'JetBrains Mono'">NO_ACTIVE_RESERVATIONS</h1>
                        <p class="opacity-25">IDLE_STATE: AWAITING_LOGS</p>
                    </div>`;
                return;
            }

            container.innerHTML = active.map(b => `
                <div class="col-md-6 col-lg-4 animate__animated animate__fadeIn">
                    <div class="room-node">
                        <div class="room-name">${b.ruangan.toUpperCase()}</div>
                        <div class="user-info"><i class="fas fa-user-circle me-2 text-secondary"></i>${b.nama}</div>
                        
                        <div class="time-box">
                            <div class="row">
                                <div class="col-6">
                                    <div class="time-label">Timeline</div>
                                    <div class="fw-bold small">${b.tglMulai} <i class="fas fa-caret-right"></i> ${b.tglSelesai}</div>
                                </div>
                                <div class="col-6 text-end">
                                    <div class="time-label">Operational_Hours</div>
                                    <div class="fw-bold" style="color: var(--primary)">${b.jamMulai} - ${b.jamSelesai}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Clock & Date Logic
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID', {hour12: false});
            document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            }).toUpperCase();
        }

        // Auto Refresh every 2 seconds
        setInterval(updateDisplay, 2000);
        setInterval(updateClock, 1000);
        
        // Initial Call
        updateDisplay();
        updateClock();
    </script>
</body>
</html>
