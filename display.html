<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TV DISPLAY - Live Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: 'Bricolage Grotesque', sans-serif; overflow: hidden; }
        .tv-header { border-bottom: 8px solid #ff0055; padding: 40px; background: #1e293b; }
        .room-card { 
            background: white; color: #0f172a; 
            border: 6px solid #0f172a; border-radius: 30px;
            box-shadow: 15px 15px 0px #ff0055;
            margin: 20px; padding: 40px;
        }
        .status-now { background: #00ff88; padding: 10px 30px; border-radius: 100px; font-size: 1.5rem; }
        .clock { font-size: 3rem; color: #ff0055; }
    </style>
</head>
<body>
    <div class="tv-header d-flex justify-content-between align-items-center">
        <div>
            <h1 class="display-2 m-0">MEETING SCHEDULE</h1>
            <p class="fs-4 opacity-50 m-0">Live Room Status Monitoring</p>
        </div>
        <div id="liveClock" class="clock">00:00:00</div>
    </div>

    <div class="container-fluid mt-5">
        <div id="tvContent" class="row"></div>
    </div>

    <script>
        function updateTV() {
            const bookings = JSON.parse(localStorage.getItem('rx_bookings_v4')) || [];
            const container = document.getElementById('tvContent');
            // Hanya tampilkan yang APPROVED
            const approved = bookings.filter(b => b.status === 'APPROVED');

            if(approved.length === 0) {
                container.innerHTML = `<div class="col-12 text-center mt-5"><h1 class="opacity-20 display-1">NO ACTIVE MEETING</h1></div>`;
                return;
            }

            container.innerHTML = approved.map(b => `
                <div class="col-md-6">
                    <div class="room-card">
                        <div class="d-flex justify-content-between align-items-start mb-4">
                            <h1 class="display-4">${b.ruangan}</h1>
                            <span class="status-now fw-bold">IN USE</span>
                        </div>
                        <h2 class="mb-4">👤 ${b.nama}</h2>
                        <hr border-3>
                        <div class="d-flex justify-content-between">
                            <h3>📅 ${b.tglMulai}</h3>
                            <h3>⏰ ${b.jamMulai} - ${b.jamSelesai}</h3>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        setInterval(() => {
            document.getElementById('liveClock').innerText = new Date().toLocaleTimeString();
            updateTV();
        }, 1000);
        updateTV();
    </script>
</body>
</html>
