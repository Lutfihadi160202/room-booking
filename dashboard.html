<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI | IT OPS - FINAL SYSTEM V9.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --neon-blue: #00f2ff; --bg-deep: #020617; --card-glass: rgba(15, 23, 42, 0.95); }
        body { 
            background: var(--bg-deep); color: white; font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; margin: 0; overflow-x: hidden;
        }

        /* SIDEBAR - TAMPILAN MEWAH */
        .sidebar { 
            width: 280px; position: fixed; height: 100vh; background: #070b17; 
            border-right: 1px solid rgba(0, 242, 255, 0.2); display: flex; flex-direction: column; z-index: 1000;
        }
        .sidebar-header { padding: 2.5rem 1.5rem; }
        .logo-text { font-family: 'Orbitron'; font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon-blue); }

        .nav-link { 
            color: #94a3b8 !important; padding: 16px 20px; margin: 0 15px 8px; 
            cursor: pointer; text-decoration: none; display: flex; align-items: center; 
            border-radius: 12px; transition: 0.3s; font-weight: 600;
        }
        .nav-link:hover, .nav-link.active { background: rgba(0, 242, 255, 0.1); color: var(--neon-blue) !important; }

        .btn-terminate { 
            margin: 20px; padding: 12px; border-radius: 12px; border: 2px solid #ef4444; 
            color: #ef4444; background: transparent; font-weight: 800; transition: 0.3s;
        }
        .btn-terminate:hover { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239,68,68,0.5); }

        /* MAIN CONTENT */
        .main-content { margin-left: 280px; padding: 3rem; }
        .glass-card { 
            background: var(--card-glass); border: 1px solid rgba(0, 242, 255, 0.15); 
            border-radius: 24px; padding: 2rem; backdrop-filter: blur(10px); height: 100%;
        }

        /* FIX TULISAN GELAP - KONTRAS TINGGI */
        label { color: var(--neon-blue) !important; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .form-control, .form-select { 
            background: #0f172a !important; border: 1px solid #334155 !important; 
            color: #ffffff !important; padding: 12px !important; border-radius: 12px !important;
        }
        .form-control:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        /* MODAL FIX */
        .modal-content { background: #0f172a !important; border: 2px solid var(--neon-blue) !important; border-radius: 24px; color: white !important; }

        /* TABLE */
        .table { color: white !important; }
        .table thead th { color: #64748b; font-size: 0.7rem; text-transform: uppercase; border-bottom: 1px solid #1e293b; }
        .st-pill { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; background: #22c55e; color: #000; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header text-center">
            <h3 class="logo-text m-0">SBI <span style="color:var(--neon-blue)">HUB</span></h3>
            <small class="text-secondary">IT OPERATIONS CENTER</small>
        </div>
        <div class="nav-menu flex-grow-1">
            <div class="nav-link active" onclick="location.reload()"><i class="fas fa-th-large me-3"></i> Dashboard</div>
            <div class="nav-link" onclick="openMaster()"><i class="fas fa-database me-3"></i> Master Nodes</div>
            <div class="nav-link" onclick="window.open('display.html', '_blank')"><i class="fas fa-desktop me-3"></i> TV Monitor</div>
        </div>
        <button class="btn-terminate" onclick="handleLogout()"><i class="fas fa-power-off me-2"></i> TERMINATE</button>
    </div>

    <div class="main-content">
        <div class="row mb-5 align-items-center">
            <div class="col">
                <h1 class="fw-bold m-0" style="font-size: 2.8rem;">TRAFFIC <span style="color:var(--neon-blue)">CONTROL</span></h1>
                <p class="text-secondary fw-bold">Infrastructure Terminal Monitoring v9.0</p>
            </div>
            <div class="col-auto">
                <div class="glass-card p-3 text-center" style="min-width: 160px; border-color: var(--neon-blue);">
                    <small style="color:var(--neon-blue); font-weight:800; display:block;">ACTIVE NODES</small>
                    <h2 class="m-0 fw-bold" id="statCount">0</h2>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="glass-card">
                    <h5 class="mb-4 fw-bold text-info"><i class="fas fa-plus-circle me-2"></i>DEPLOY NEW</h5>
                    <form id="deployForm">
                        <div class="mb-3">
                            <label>IDENTIFIER / USER</label>
                            <input type="text" id="inpUser" class="form-control" placeholder="Type user..." required>
                        </div>
                        <div class="mb-3">
                            <label>TARGET NODE</label>
                            <select id="inpRoom" class="form-select" onchange="updateInfo()"></select>
                        </div>
                        <div id="roomInfoBox" class="p-3 mb-4 rounded-3 bg-black border border-secondary text-info small fw-bold" style="min-height: 60px;"></div>
                        <button type="submit" class="btn btn-info w-100 py-3 fw-bold text-dark" style="border-radius:15px; background:var(--neon-blue); border:none;">EXECUTE COMMAND</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="glass-card">
                    <h5 class="mb-4 fw-bold text-secondary"><i class="fas fa-list me-2"></i>ACTIVITY LOG</h5>
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>USER</th><th>NODE</th><th>STATUS</th><th class="text-end">ACTION</th></tr></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalMaster" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-5">
                    <div class="d-flex justify-content-between mb-4 align-items-center">
                        <h4 class="logo-text text-info m-0">DATABASE MASTER</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="row">
                        <div class="col-md-5">
                            <label>Node Name</label>
                            <input type="text" id="mName" class="form-control mb-3" placeholder="Room A">
                            <label>Capacity</label>
                            <input type="text" id="mCap" class="form-control mb-3" placeholder="10 Pax">
                            <label>Infrastructure</label>
                            <textarea id="mFac" class="form-control mb-4" rows="3" placeholder="Assets..."></textarea>
                            <button onclick="addNode()" class="btn btn-info w-100 fw-bold py-3 text-dark">SAVE TO DATABASE</button>
                        </div>
                        <div class="col-md-7 border-start border-secondary ps-4">
                            <label>REGISTERED NODES</label>
                            <div id="masterList" style="max-height: 350px; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let db_rooms = JSON.parse(localStorage.getItem('sbi_rooms')) || [{nama:"WAR ROOM", cap:"12 Pax", fac:"Fiber, AC"}];
        let db_logs = JSON.parse(localStorage.getItem('sbi_logs')) || [];

        // --- FIX LOGOUT: Balik ke index.html karena login.html tidak ada ---
        function handleLogout() {
            if(confirm("Terminate Session?")) {
                window.location.href = "index.html"; 
            }
        }

        function openMaster() { renderMaster(); new bootstrap.Modal(document.getElementById('modalMaster')).show(); }
        
        function addNode() {
            const name = document.getElementById('mName').value;
            if(!name) return;
            db_rooms.push({ nama: name.toUpperCase(), cap: document.getElementById('mCap').value, fac: document.getElementById('mFac').value });
            localStorage.setItem('sbi_rooms', JSON.stringify(db_rooms));
            document.getElementById('mName').value = ""; renderMaster(); refresh();
        }

        function renderMaster() {
            document.getElementById('masterList').innerHTML = db_rooms.map((r, i) => `
                <div class="p-3 mb-2 bg-black rounded-4 border border-secondary d-flex justify-content-between align-items-center">
                    <div><b class="text-info">${r.nama}</b><br><small class="text-muted">${r.cap}</small></div>
                    <button class="btn btn-sm text-danger" onclick="db_rooms.splice(${i},1);localStorage.setItem('sbi_rooms',JSON.stringify(db_rooms));renderMaster();refresh();"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function refresh() {
            document.getElementById('inpRoom').innerHTML = db_rooms.map(r => `<option value="${r.nama}">${r.nama}</option>`).join('');
            document.getElementById('tableBody').innerHTML = db_logs.map(l => `
                <tr class="border-secondary">
                    <td><b class="text-white">${l.user}</b></td>
                    <td class="text-info fw-bold">${l.room}</td>
                    <td><span class="st-pill">APPROVED</span></td>
                    <td class="text-end"><button class="btn btn-sm text-danger" onclick="db_logs=db_logs.filter(x=>x.id!==${l.id});localStorage.setItem('sbi_logs',JSON.stringify(db_logs));refresh();"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
            document.getElementById('statCount').innerText = db_logs.length;
            updateInfo();
        }

        document.getElementById('deployForm').addEventListener('submit', function(e) {
            e.preventDefault();
            db_logs.unshift({ id: Date.now(), user: document.getElementById('inpUser').value.toUpperCase(), room: document.getElementById('inpRoom').value });
            localStorage.setItem('sbi_logs', JSON.stringify(db_logs));
            this.reset(); refresh();
        });

        function updateInfo() {
            const r = db_rooms.find(x => x.nama === document.getElementById('inpRoom').value);
            document.getElementById('roomInfoBox').innerHTML = r ? `<i class="fas fa-info-circle me-2"></i> ${r.cap} | ${r.fac}` : "Select Node...";
        }

        refresh();
    </script>
</body>
</html>
